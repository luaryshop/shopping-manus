/* ==========================================================================

.section-link{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--coral);font-weight:800;white-space:nowrap}

.intents{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.intent{min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:800;box-shadow:var(--shadow-sm);transition:transform .22s,border-color .22s,box-shadow .22s}
.intent:hover,.intent[aria-pressed=true]{transform:translateY(-3px);border-color:var(--coral);box-shadow:var(--shadow)}
.intent-icon{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:var(--tone,var(--coral));background:color-mix(in srgb,var(--tone,var(--coral)) 13%,transparent)}
.intent-icon .ico{width:20px;height:20px}
.intent small{display:block;margin-top:1px;color:var(--muted);font-weight:500;font-size:11px;line-height:1.25}
.intent-aberto,.filter-aberto{--tone:#168b59}
.intent-emergencia,.filter-emergencia{--tone:#c55245}
.intent-delivery,.filter-delivery{--tone:#4788d9}
.intent-entregagratis,.filter-entregagratis{--tone:#168b59}
.intent-perto,.filter-perto{--tone:#b18028}

.category-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.category{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:13px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:12px;text-align:center;transition:transform .22s,border-color .22s,box-shadow .22s,color .22s}
.category:hover,.category[aria-pressed=true]{color:var(--ink);border-color:var(--coral);transform:translateY(-4px);box-shadow:var(--shadow-sm)}
.cat-icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--surface-2);color:var(--tone,var(--coral))}
.cat-icon .ico{width:23px;height:23px}
.category[data-color=blue]{--tone:var(--blue)}   .category[data-color=mint]{--tone:var(--mint)}
.category[data-color=amber]{--tone:var(--amber)} .category[data-color=violet]{--tone:var(--purple)}
.category[data-color=rose]{--tone:var(--rose)}   .category[data-color=sky]{--tone:var(--sky)}
.category[data-color=lime]{--tone:var(--lime)}   .category[data-color=orange]{--tone:var(--orange)}

/* ==========================================================================
   6. BLOCOS FIXOS
   ========================================================================== */
.banners-fixed{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:15px 0 10px}
.banner-card{position:relative;overflow:hidden;border-radius:24px;padding:26px 28px;color:#fff;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:center;min-height:180px;transition:transform .22s,box-shadow .22s}
.banner-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.banner-card::after{content:"";position:absolute;right:-10%;bottom:-40%;width:60%;height:160%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--coral) 80%,transparent),transparent 65%);pointer-events:none}
.banner-card[data-color=navy]{background:linear-gradient(120deg,#102448,#1b477d)}
.banner-card[data-color=coral]{background:linear-gradient(120deg,#b94e38,#e66a4e)}
.banner-card .eyebrow{color:#ffd1a6;margin-bottom:6px}
.banner-card h2{position:relative;z-index:1;font:700 clamp(22px,2.5vw,30px)/1.05 var(--display);margin:4px 0 8px}
.banner-card p{position:relative;z-index:1;color:#f7e4d3;margin:0 0 16px;font-size:13px;line-height:1.4}
.banner-card a{position:relative;z-index:2;align-self:flex-start;border-radius:999px;background:#fff;color:#132b52;padding:9px 15px;font-weight:800;font-size:13px}

/* ==========================================================================
   7. CARDS DE EMPRESA & GRID RECONFIGURADO
   ========================================================================== */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:stretch}
.business-card{position:relative;overflow:hidden;min-width:0;height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow-sm);transition:transform .26s,box-shadow .26s,border-color .26s}
.business-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--coral) 45%,var(--line))}
.cover{position:relative;display:block;flex:none;width:100%;aspect-ratio:16/10;overflow:hidden;border:0;padding:0;background:var(--surface)}
.cover img{width:100%;height:100%;display:block;object-fit:contain;transition:transform .6s;background:var(--surface)}
.business-card:hover .cover img{transform:scale(1.06)}
.cover::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(8,20,45,.65))}
.badge{position:absolute;z-index:1;left:11px;top:11px;display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.9);color:#15315c;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.badge.premium{background:var(--amber);color:#32220a}
.badge.verified{left:auto;right:11px;background:var(--green);color:#fff}
.save{position:absolute;z-index:2;right:10px;top:53px;width:35px;height:35px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(9,22,45,.5);color:#fff;backdrop-filter:blur(7px)}
.save[aria-pressed=true]{background:#fff;color:var(--coral)}
.save[aria-pressed=true] .ico{fill:currentColor}
.save .ico{width:17px;height:17px}

.card-body{display:flex;flex-direction:column;flex-grow:1;min-width:0;padding:15px}
.card-body h3{margin:0;font:700 22px/1.2 var(--display);letter-spacing:-.01em;overflow-wrap:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:6px;min-width:0;color:var(--muted);font-size:12px}
.card-meta>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-desc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;margin:10px 0;color:var(--muted);font-size:13px;line-height:1.4}
.card-location{display:flex;align-items:center;gap:5px;margin-top:auto;min-width:0;color:var(--muted);font-size:12px}
.card-location .ico{width:15px;height:15px;color:var(--coral)}
.card-location span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{min-height:37px;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn .ico{width:15px;height:15px}

/* Botão WhatsApp (Verde) */
.btn-wa {
  background: var(--green);
  border-color: var(--green);
  color: #ffffff !important;
}

/* Botão Ligar (Azul) - Modo Claro e Escuro */
[data-track="ligar"] {
  background: #1e40af;
  border-color: #1e40af;
  color: #ffffff !important;
}
:root[data-theme=dark] [data-track="ligar"] {
  background: #2563eb;
  border-color: #2563eb;
  color: #ffffff !important;
}

/* Botão Compartilhar (Roxo) - Modo Claro e Escuro */
#share-company {
  background: #6b21a8;
  border-color: #6b21a8;
  color: #ffffff !important;
}
:root[data-theme=dark] #share-company {
  background: #7c3aed;
  border-color: #7c3aed;
  color: #ffffff !important;
}

.open-status{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;font-weight:800;color:var(--green)}
.open-status.closed{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.rating-label{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.rating-score{color:var(--ink)}
.rating-score strong{color:var(--amber);font-weight:800}
.rating-new{color:var(--coral);font-weight:700}
.rating-empty{color:var(--muted);font-weight:600}

/* ==========================================================================
   8. PAINÉIS, NOTÍCIAS, CTA
   ========================================================================== */
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:21px;box-shadow:var(--shadow-sm)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:15px}
.panel-head>div{min-width:0}
.panel-head>.ico{width:58px;height:58px;color:var(--coral);stroke-width:1.55}
.panel h3{max-width:15ch;margin:0;font:700 29px/1.05 var(--display)}
.panel-head p{max-width:32ch;margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}

.nearby-list{display:grid;gap:8px}
.nearby-row{min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:9px;background:var(--surface-2);text-align:left}
.nearby-row .mini-cover{width:44px;height:44px;flex:none;border-radius:12px;object-fit:cover;background:var(--surface)}
.nearby-row .txt{min-width:0;flex:1}
.nearby-row strong,.nearby-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nearby-row strong{font-size:13px}
.nearby-row small{color:var(--muted);font-size:11px}
.nearby-row .rank{margin-left:auto;color:var(--amber);font-weight:800}

.emergency{background:linear-gradient(135deg,#311c2a,#5c2e37);color:#fff;border:0}
.emergency .panel-head p{color:#f5c7bc}
.emergency .panel-head>.ico{color:#ffe8dc}
.plantao-card{width:100%;min-width:0;display:flex;align-items:flex-start;gap:12px;margin-top:8px;padding:12px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(255,255,255,.1);color:#fff;text-align:left}
.plantao-card:hover{background:rgba(255,255,255,.17)}
.plantao-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.12);color:#ffc283}
.plantao-card .txt{min-width:0;flex:1}
.plantao-card strong,.plantao-card small{display:block;overflow-wrap:anywhere;line-height:1.35}
.plantao-card small{margin-top:3px;font-size:11px;color:#f4d9d0}
.arrow-link{flex:none;color:#ffc283;font-size:24px}
.emergency-count{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.14);font-size:12px;color:#f4d9d0}

.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.news-card{position:relative;overflow:hidden;min-height:170px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:19px}
.news-card::after{content:"";position:absolute;right:-25px;bottom:-40px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--coral) 9%,transparent)}
.news-card .eyebrow{font-size:10px}
.news-card h3{margin:13px 0 8px;font:700 24px/1 var(--display)}
.news-card p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:13px}

.cta-business{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:17px 0;padding:23px 27px;border-radius:24px;background:linear-gradient(110deg,var(--navy),var(--navy-2));color:#fff}
:root[data-theme=dark] .cta-business{color:#091225}
.cta-business h2{margin:0;font:700 30px/1 var(--display)}
.cta-business p{margin:6px 0 0;opacity:.8}
.cta-business a{background:var(--coral);color:#fff;border-radius:999px;padding:12px 17px;font-weight:800;white-space:nowrap}

/* ==========================================================================
   9. BUSCA, FILTROS, FAVORITOS, CADASTRO
   ========================================================================== */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.filter-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px;font-weight:700}
.filter-chip .ico{width:17px;height:17px;color:var(--tone,var(--coral))}
.filter-chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.filter-clear{color:var(--coral);background:color-mix(in srgb,var(--coral) 8%,var(--surface))}
.result-count{color:var(--muted);font-size:13px}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:22px;padding:46px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty .ico{width:40px;height:40px;color:var(--coral);margin-bottom:8px}

.profile-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.form-card{max-width:650px;border:1px solid var(--line);border-radius:24px;padding:22px;background:var(--surface);box-shadow:var(--shadow-sm)}
.form-card label{display:grid;gap:6px;margin-bottom:13px;font-weight:700;font-size:13px}
.form-card input,.form-card select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form-card button{width:100%;border:0;border-radius:12px;background:var(--coral);color:#fff;padding:13px;font-weight:800}
.form-card button:disabled{opacity:.6;cursor:progress}
.notice{margin-bottom:14px;padding:11px;border-radius:12px}
.notice.ok{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.notice.err{background:color-mix(in srgb,var(--coral) 12%,transparent);color:var(--coral)}

/* --- Cadastro com escolha de plano --- */
.plan-picker{border:0;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.plan-picker legend{font-weight:700;font-size:13px;margin-bottom:8px;padding:0}
.form-card .plan-opt{display:flex;align-items:center;gap:9px;margin:0;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer;font-weight:600}
.form-card .plan-opt input{width:auto;padding:0;margin:0;accent-color:var(--coral)}
.plan-opt span{display:grid;line-height:1.25}.plan-opt small{color:var(--muted);font-weight:600;font-size:11px}
.plan-opt.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 8%,var(--bg))}
.plan-benefits{border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:14px;background:color-mix(in srgb,var(--coral) 5%,var(--surface))}
.plan-benefits h4{margin:0 0 8px;font:700 21px/1 var(--display)}
.plan-benefits ul{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.plan-benefits li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.plan-benefits li .ico{width:16px;height:16px;flex:none;color:var(--green);margin-top:2px}
.plan-benefits .upsell{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:9px;margin:0}
.plan-benefits .upsell b{color:var(--coral)}
button.plan-mini{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.plan-mini.on{border-color:var(--coral);box-shadow:0 0 0 3px color-mix(in srgb,var(--coral) 16%,transparent)}
/* --- Botões de redes sociais (plano Premium) --- */
.social-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.social-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:13px;color:#fff;font-weight:800;font-size:13px}
.social-btn .ico{width:18px;height:18px}
.social-btn.ig{background:linear-gradient(135deg,#7a3fc0,#d6366f 55%,#f08a3c)}
.social-btn.fb{background:#1877f2}
@media(max-width:560px){.plan-picker{grid-template-columns:1fr 1fr}}
.plans-mini{display:grid;gap:10px;align-content:start}
.plan-mini{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px}
.plan-mini h3{margin:0;font:700 23px/1 var(--display)}
.plan-mini strong{color:var(--coral);font-size:13px}
.plan-mini p{margin:5px 0 0;color:var(--muted);font-size:12px}

.loading{padding:90px 0;text-align:center;color:var(--muted)}

/* ==========================================================================
   10. MODAL DA EMPRESA
   ========================================================================== */
.veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(7,14,30,.72)}
.sheet{position:relative;width:min(960px,100%);height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden;border-radius:26px;background:var(--surface);box-shadow:var(--shadow)}
.sheet-close{position:absolute;z-index:5;top:14px;right:14px;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.sheet-close .ico{width:20px;height:20px}

.sheet-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sheet-media{min-width:0;display:flex;align-items:center;justify-content:center;background:#081631;padding:16px}
.sheet-media-inner{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;width:100%}
.sheet-gallery{position:relative;width:min(100%,calc(100dvh - 240px));aspect-ratio:1;overflow:hidden}
.sheet-gallery img{width:100%;height:100%;display:block;object-fit:contain}
.gallery-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;pointer-events:none}
.gallery-nav button{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#102448}
.gallery-count{position:absolute;right:14px;bottom:14px;border-radius:999px;background:rgba(6,16,35,.72);color:#fff;font-size:12px;padding:5px 10px}

/* Miniaturas exclusivas no Modal de Detalhes */
.sheet-thumbs{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px;scrollbar-width:none}
.sheet-thumbs::-webkit-scrollbar{display:none}
.sheet-thumbs .thumb-btn{width:44px;height:44px;flex:none;padding:0;border:2px solid rgba(255,255,255,.3);border-radius:8px;overflow:hidden;background:#000;cursor:pointer;transition:border-color .2s,transform .15s}
.sheet-thumbs .thumb-btn.active,.sheet-thumbs .thumb-btn:hover{border-color:var(--coral);transform:scale(1.05)}
.sheet-thumbs .thumb-btn img{width:100%;height:100%;object-fit:cover;display:block}

.sheet-info{min-width:0;overflow-y:auto;padding:30px 28px 28px}
.sheet-info h2{margin:0 52px 9px 0;font:700 42px/.95 var(--display);overflow-wrap:anywhere}
.sheet-info p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.category-line{color:var(--muted);font-size:13px}
.detail-status{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}
.detail-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:7px 10px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700}
.detail-pill .ico{width:15px;height:15px}
.detail-pill.live,.detail-pill.verify{color:var(--green)}
.detail-block{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.detail-block h3{margin:0 0 10px;font:700 24px/1 var(--display)}
.detail-row{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;font-size:13px}
.detail-row b{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.links a .ico{width:16px;height:16px}
.links .waze-link{color:#4878ff;border-color:color-mix(in srgb,#4878ff 35%,var(--line));background:color-mix(in srgb,#4878ff 7%,transparent)}
.hours{display:grid;gap:8px;font-size:13px}
.hours-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:9px 11px}
.hours-row span{color:var(--muted)}
.hours-row strong{text-align:right;white-space:nowrap}

.sheet-actions{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.sheet-actions .btn{min-height:46px;border-radius:13px;font-size:13px;gap:7px}
.sheet-actions .btn .ico{width:17px;height:17px}

footer{max-width:var(--max);margin:50px auto 0;padding:25px 22px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px}
.footer-brand{font:700 21px var(--display);color:var(--ink)}
footer a{color:var(--coral);font-weight:700}

/* ==========================================================================
   11. RESPONSIVO
   ========================================================================== */
@media(min-width:900px){
  body{padding-bottom:0}
  .tabbar{position:static;max-width:var(--max);margin:0 auto 6px;padding:0 22px;justify-content:flex-start;gap:7px;background:transparent;border:0;backdrop-filter:none}
  .tabbar button{flex:none;flex-direction:row;gap:7px;border:1px solid transparent;border-radius:999px;padding:9px 13px;font-size:13px}
  .tabbar button[aria-current=page]{background:var(--surface);border-color:var(--line)}
}

@media(max-width:1100px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .category-grid{grid-template-columns:repeat(5,1fr)}

.btn-go,.btn-send{position:relative}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:10px -2px 0;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.chip-row .filter-chip,.cat-chip{min-height:44px;padding:0 14px;white-space:nowrap}

.cat-chip .ico{width:18px;height:18px;color:var(--coral)}

.filter-clear{border-style:dashed}
.search-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:6px 0 14px}

.result-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 12px}

.result-count{color:var(--muted);font-size:13px;font-weight:700}
.notice-inline{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:13px;color:var(--muted)}
.notice-inline .ico{width:20px;height:20px;color:var(--coral);flex:none;margin-top:1px}
.sponsor-note{margin:16px 2px 0;font-size:12px;color:var(--muted)}
.dist{color:var(--green);font-weight:800}
.empty .empty-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.empty .empty-actions a,.empty .empty-actions button{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;text-decoration:none;cursor:pointer}
.empty .empty-actions .primary{background:var(--coral);border-color:var(--coral);color:#fff}

const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const fmtHour = (h) => { const m = Math.round((h % 1) * 60); return `${Math.floor(h)}h${m ? String(m).padStart(2, '0') : ''}`; };
const slotOf = (e, day) => e.t24 ? [0, 24] : day === 0 ? e.h.sun : day === 6 ? e.h.sat : e.h.wk;

function status(e, now = new Date()) {
  if (e.t24) return { on: true, text: 'Aberto 24 horas' };
  if (e.noHours) return { on: false, text: 'Horário não informado' };
  const day = now.getDay();
  const t = now.getHours() + now.getMinutes() / 60;
  const today = slotOf(e, day);
  if (today && t >= today[0] && t < today[1]) return { on: true, text: `Aberto agora · fecha às ${fmtHour(today[1])}` };
  for (let k = 0; k < 8; k++) {
    const d = (day + k) % 7, s = slotOf(e, d);
    if (!s || (k === 0 && t >= s[0])) continue;
    const when = k === 0 ? 'hoje' : k === 1 ? 'amanhã' : DIAS[d];
    return { on: false, text: `Fechado · abre ${when} às ${fmtHour(s[0])}` };
  }
  return { on: false, text: 'Fechado agora' };
}

/* ==========================================================================
   BUSCA INTELIGENTE
   Entende sinônimos (cabelo → salão), plural, acentos e pequenos erros de digitação.
   Os grupos de sinônimos ficam em config.js (SINONIMOS).
   ========================================================================== */
const STOP = new Set('a o as os de da do das dos e em um uma para por com no na nos nas perto preciso quero procuro buscar tem que mais ao aos pra pro meu minha'.split(' '));
const SYN = new Map();
SINONIMOS.forEach((g, i) => g.forEach((w) => { const k = norm(w); if (!SYN.has(k)) SYN.set(k, new Set()); SYN.get(k).add(i); }));
const stem = (w) => w.length > 4 ? w.replace(/(es|s)$/, '') : w;
const wordsOf = (v) => norm(v).split(/[^a-z0-9]+/).filter(Boolean);

function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      best = Math.min(best, cur[j]);
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

function hayOf(e) {
  if (e._hay) return e._hay;
  const extra = [e.t24 ? '24h 24 horas plantao' : '', e.emergency ? 'emergencia urgencia plantao' : '', e.delivery ? 'delivery entrega' : '', e.orc ? 'orcamento' : ''];
  const name = norm(e.name);
  const rest = norm([e.cat, e.sub, e.desc, e.bairro, ...e.tags, ...(e.keywords || []), ...extra].join(' '));
  return (e._hay = { name, all: `${name} ${rest}`, words: new Set(wordsOf(`${e.name} ${rest}`)) });
}

function altsOf(term) {
  const out = new Set(); const st = stem(term);
  for (const [w, groups] of SYN) {
    if (w === term || w === st || stem(w) === st || (term.length >= 4 && (w.startsWith(term) || (w.length >= 4 && term.startsWith(w))))) {
      groups.forEach((g) => SINONIMOS[g].forEach((x) => out.add(norm(x))));
    }
  }
  out.delete(term);
  return [...out];
}

/* 0 = não combina · 4 nome · 3 texto · 1,5 sinônimo · 1 erro de digitação */
function relevance(e, tokens) {
  const h = hayOf(e); let total = 0;
  for (const t of tokens) {
    const st = stem(t); let sc = 0;
    if (h.name.includes(t) || (st.length >= 3 && h.name.includes(st))) sc = 4;
    else if (h.all.includes(t) || (st.length >= 3 && h.all.includes(st))) sc = 3;
    else if (altsOf(t).some((a) => a.length >= 2 && (a.includes(' ') ? h.all.includes(a) : h.words.has(a)))) sc = 1.5;
    else if (t.length >= 4) {
      const max = t.length >= 7 ? 2 : 1;
      for (const w of h.words) if (lev(w, t, max) <= max) { sc = 1; break; }
    }
    if (!sc) return 0;
    total += sc;
  }
  return total;
}

const rad = (v) => v * Math.PI / 180;
function distOf(e) {
  if (!state.geo || !e.location) return null;
  const dLat = rad(e.location.lat - state.geo.lat), dLng = rad(e.location.lng - state.geo.lng);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(state.geo.lat)) * Math.cos(rad(e.location.lat)) * Math.sin(dLng / 2) ** 2;
  return 6371 * 2 * Math.asin(Math.sqrt(x));
}
const fmtDist = (km) => km < 1 ? `a ${Math.max(50, Math.round(km * 10) * 100)} m` : `a ${km.toFixed(1).replace('.', ',')} km`;

const PLAN_RANK = { premium: 0, destaque: 1, presenca: 2, gratis: 3 };
const sortCompanies = (items) => [...items].sort((a, b) => (PLAN_RANK[a.plan] ?? 9) - (PLAN_RANK[b.plan] ?? 9) || a.ordem - b.ordem);

function searchTokens() {
  const all = wordsOf(state.q);
  const keep = all.filter((t) => t.length > 1 && !STOP.has(t));
  return keep.length ? keep : all;
}

function filtered() {
  const tokens = searchTokens();
  const list = [];
  for (const e of COMPANIES) {
    if (state.cat && e.catId !== state.cat) continue;
    if (state.bairro && e.bairro !== state.bairro) continue;
    const open = status(e).on;
    if (state.intent === 'aberto' && !open) continue;
    if (state.intent === 'emergencia' && !(e.emergency || e.t24)) continue;
    if (state.intent === 'delivery' && !e.delivery) continue;
    if (state.intent === 'entregagratis' && !(e.delivery && e.f === 0)) continue;
    let rel = 0;
    if (tokens.length) { rel = relevance(e, tokens); if (!rel) continue; }
    list.push({ e, tier: tokens.length ? Math.floor(rel / tokens.length) : 0, open, d: distOf(e) });
  }
  const byDistance = state.intent === 'perto' && state.geo;
  list.sort((a, b) =>
    (byDistance ? (a.d ?? 1e9) - (b.d ?? 1e9) : 0)
    || b.tier - a.tier
    || Number(b.open) - Number(a.open)
    || (PLAN_RANK[a.e.plan] ?? 9) - (PLAN_RANK[b.e.plan] ?? 9)
    || a.e.ordem - b.e.ordem);
  return list.map((x) => x.e);
}

const bairros = () => [...new Set(COMPANIES.map((e) => e.bairro).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));

function askLocation() {
  if (!navigator.geolocation) { state.geoStatus = 'indisponivel'; return; }
  state.geoStatus = 'pedindo';
  navigator.geolocation.getCurrentPosition(
    (pos) => { state.geo = { lat: pos.coords.latitude, lng: pos.coords.longitude }; state.geoStatus = 'ok'; if (state.view === 'buscar') paintResults(); },
    () => { state.geoStatus = 'negado'; if (state.view === 'buscar') paintResults(); },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 300000 }
  );
}

  return `<span class="rating-label rating-score"><strong>${esc(score)}</strong> · ${count} avaliações</span>`;
}

      ${e.verified ? `<span class="badge verified">${icon('check')} Verificado</span>` : ''}
    </button>
    <button class="save" data-fav="${esc(e.id)}" aria-pressed="${fav}" aria-label="${fav ? 'Remover dos favoritos:' : 'Salvar nos favoritos:'} ${esc(e.name)}">${icon('heart')}</button>

      <h3>${esc(e.name)}</h3>
      <div class="card-meta">${ratingLabel(e)}<span>·</span><span>${esc(e.cat)}</span></div>
      <div class="open-status ${s.on ? '' : 'closed'}"><span class="dot"></span>${esc(s.on ? 'Aberto agora' : s.text)}</div>

      <div class="card-location">${icon('pin')}<span>${esc(e.bairro || BRAND.city)}${distOf(e) != null ? ` · <span class="dist">${fmtDist(distOf(e))}</span>` : ''}</span></div>
      <div class="card-actions ${hasWa(e) ? '' : 'single'}">
        ${hasWa(e) ? `<a class="btn btn-wa" data-track="whatsapp" data-id="${esc(e.id)}" href="${links.wa(e)}" target="_blank" rel="noopener">${icon('whatsapp')} WhatsApp</a>` : ''}
        <a class="btn" data-track="ligar" data-id="${esc(e.id)}" href="${links.tel(e)}">${icon('phone')} Ligar</a>
      </div>
    </div>
  </article>`;
}

/* Lista compacta (resultados e favoritos): foto pequena + o essencial. A ficha completa abre ao tocar. */
function chipsOf(e) {
  const out = [];
  if (e.delivery) out.push(`<span class="mchip mchip-moto">${icon('moto')}Delivery</span>`);
  if (e.delivery && e.f === 0) out.push(`<span class="mchip mchip-free">${icon('gift')}Entrega grátis</span>`);
  if (e.t24) out.push(`<span class="mchip">${icon('clock')}24 horas</span>`);
  if (e.orc) out.push('<span class="mchip">Orçamento</span>');
  if (e.ret && out.length < 3) out.push('<span class="mchip">Retirada</span>');
  return out.slice(0, 3).join('');
}

function rowCard(e, opt = {}) {
  const s = opt.status || status(e);
  const fav = state.favs.has(e.id);
  const wa = opt.wa ?? hasWa(e);
  const prem = e.plan === 'premium', dest = e.plan === 'destaque';
  const ribbon = prem ? `<span class="rbadge rb-premium">★ Premium</span>` : dest ? `<span class="rbadge rb-destaque">Destaque</span>` : '';
  const thumb = opt.preview
    ? `<span class="row-thumb ph">${icon('store')}</span>`
    : `<img class="row-thumb" loading="lazy" alt="" src="${urlFoto(e.id, 0, e.ver)}">`;
  const dist = !opt.preview && distOf(e) != null ? ` · <span class="dist">${fmtDist(distOf(e))}</span>` : '';
  return `<article class="row-card plan-${esc(e.plan)}${opt.preview ? ' is-preview' : ''}">
    ${opt.preview ? '' : `<button class="row-open" data-open="${esc(e.id)}" aria-label="Abrir ficha de ${esc(e.name)}"></button>`}
    <div class="row-top">
      <div class="row-media">${thumb}${ribbon}</div>
      <div class="row-body">
        <h3>${esc(e.name)}${e.verified ? `<span class="vcheck" title="Perfil verificado">${icon('check')}</span>` : ''}</h3>
        <div class="row-sub">${ratingLabel(e)}</div>
        <div class="row-sub">${esc(e.cat)} · ${esc(e.bairro || BRAND.city)}${dist}</div>
        <div class="open-status ${s.on ? '' : 'closed'}"><span class="dot"></span>${esc(s.text)}</div>
      </div>
      ${opt.preview ? '' : `<button class="row-fav save" data-fav="${esc(e.id)}" aria-pressed="${fav}" aria-label="${fav ? 'Remover dos favoritos:' : 'Salvar nos favoritos:'} ${esc(e.name)}">${icon('heart')}</button>`}
    </div>
    ${chipsOf(e) ? `<div class="row-chips">${chipsOf(e)}</div>` : ''}
    <div class="row-actions">
      ${!wa && (opt.preview ? opt.num : waNum(e)) ? `<span class="ra ra-num">${icon('whatsapp')}<span>${esc(opt.preview ? opt.num : waNum(e))}</span></span>` : ''}
      ${wa ? `<a class="ra ra-wa" ${opt.preview ? '' : `data-track="whatsapp" data-id="${esc(e.id)}" href="${links.wa(e)}" target="_blank" rel="noopener"`}>${icon('whatsapp')}<span>WhatsApp</span></a>` : ''}
      <a class="ra" ${opt.preview ? '' : `data-track="ligar" data-id="${esc(e.id)}" href="${links.tel(e)}"`}>${icon('phone')}<span>Ligar</span></a>
      <a class="ra ra-rota" aria-label="Como chegar" ${opt.preview ? '' : `href="${links.maps(e)}" target="_blank" rel="noopener"`}>${icon('route')}<span>Rota</span></a>
    </div>
  </article>`;
}

/* Cartão pequeno para o carrossel de destaques da página inicial */
function miniCard(e) {
  const s = status(e);
  const label = e.plan === 'premium' ? '★ Premium' : 'Destaque';
  return `<button class="mini-card" data-open="${esc(e.id)}" aria-label="Abrir ficha de ${esc(e.name)}">
    <span class="mini-img"><img loading="lazy" alt="" src="${urlFoto(e.id, 0, e.ver)}"><span class="rbadge ${e.plan === 'premium' ? 'rb-premium' : 'rb-destaque'}">${label}</span></span>
    <span class="mini-body"><strong>${esc(e.name)}${e.verified ? `<span class="vcheck">${icon('check')}</span>` : ''}</strong>
    <small>${esc(e.cat)} · ${esc(e.bairro || BRAND.city)}</small>
    <span class="open-status ${s.on ? '' : 'closed'}"><span class="dot"></span>${esc(s.on ? 'Aberto agora' : s.text)}</span></span>
  </button>`;
}

const emptyState = (ico, title, text) => `<div class="empty">${icon(ico)}<br><strong>${title}</strong><br>${text}</div>`;

function emptyResults() {
  const q = state.q.trim();
  const filtros = state.cat || state.intent || state.bairro;
  const title = q ? `Não encontramos “${esc(q)}”.` : 'Nenhuma empresa com esses filtros.';
  const dica = q ? 'Tente uma palavra mais simples (ex.: farmácia, cabelo, marmita) ou escolha uma categoria.' : 'Tire um filtro para ver mais opções.';
  const wa = BRAND.whatsapp ? `<a class="primary" href="https://wa.me/${digits(BRAND.whatsapp)}?text=${encodeURIComponent(`Olá! Procurei “${q || 'um serviço'}” no ${BRAND.name} ${BRAND.city} e não encontrei. Podem me ajudar?`)}" target="_blank" rel="noopener">${icon('whatsapp')} Pedir ajuda no WhatsApp</a>` : '';
  return `<div class="empty">${icon('search')}<br><strong>${title}</strong><br>${dica}
    <div class="chip-row" style="margin-top:14px">${CATEGORIAS.slice(0, 6).map((c) => `<button class="cat-chip" data-cat="${c.id}">${icon(c.icon)}${esc(c.nome)}</button>`).join('')}</div>
    <div class="empty-actions">${(q || filtros) ? `<button data-clear>${icon('x')} Limpar busca e filtros</button>` : ''}${wa}<button data-go="perfil">${icon('store')} Minha empresa não está aqui</button></div>
  </div>`;
}
const resultsHTML = (items) => items.length ? items.map((e) => rowCard(e)).join('') : emptyResults();

function sectionHead(title, sub, go = 'buscar') {
  return `<div class="section-head"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><button class="section-link" data-go="${go}">Ver todos →</button></div>`;
}

function globalSearch({ button = true } = {}) {
  return `<div class="global-search">
    <label for="global-q"><span class="sr">Buscar empresa, serviço ou categoria</span><span class="gs-icon">${icon('search')}</span></label>
    <input id="global-q" type="search" autocomplete="off" placeholder="Buscar farmácia, salão…" value="${esc(state.q)}">
    ${button ? '<button class="btn-go" data-go="buscar" type="button">Buscar</button>' : ''}
  </div>`;
}

function suggestions() {
  if (!state.q.trim()) return '';
  const found = filtered().slice(0, 5);
  const body = found.map((e) => `<button data-open="${esc(e.id)}">${icon('search')}<span><strong>${esc(e.name)}</strong><small class="muted">${esc(e.cat)} · ${esc(e.bairro)}</small></span></button>`).join('')
    || `<button data-go="buscar">${icon('search')}Ver resultados para “${esc(state.q)}”</button>`;
  return `<div class="suggestions" role="listbox">${body}</div>`;
}

  </section>`;
}

function resultsTitle() {
  if (state.q.trim()) return `Resultados para <em>“${esc(state.q.trim())}”</em>`;
  const cat = CATEGORIAS.find((c) => c.id === state.cat);
  if (cat) return esc(cat.nome);
  const it = INTENCOES.find((i) => i.id === state.intent);
  return it ? esc(it.label) : 'Todas as empresas';
}

function geoNotice() {
  if (state.intent !== 'perto') return '';
  const note = (txt, extra = '') => `<div class="notice-inline" role="status">${icon('pin')}<span>${txt}${extra}</span></div>`;
  if (state.geoStatus === 'pedindo') return note('Procurando sua localização…');
  if (state.geoStatus === 'negado' || state.geoStatus === 'indisponivel') return note('Não conseguimos usar sua localização. Escolha o seu bairro na lista acima para ver quem está por perto.');
  if (state.geo) return COMPANIES.some((e) => e.location)
    ? note('Ordenado pela distância até você. Sua localização fica só no seu aparelho e não é guardada.')
    : note('Ainda não temos o mapa dessas empresas. Escolha seu bairro na lista acima.');
  return note('Para ordenar pela distância, precisamos saber onde você está. ', '<button class="section-link" data-geo type="button">Usar minha localização</button>');
}

function resultsArea() {
  const results = filtered();
  const anunciantes = results.some((e) => e.plan === 'premium' || e.plan === 'destaque');
  return `${geoNotice()}
    <div class="result-line"><h2 id="results-title">${resultsTitle()}</h2><span class="result-count" id="results-count" role="status">${results.length} ${results.length === 1 ? 'resultado' : 'resultados'}</span></div>
    <div class="row-list" id="results">${resultsHTML(results)}</div>
    ${anunciantes ? '<p class="sponsor-note">Empresas Premium e Destaque são anunciantes do guia. Entre as que estão abertas agora, elas aparecem primeiro.</p>' : ''}`;
}

function paintResults() {

    ${f.whatsapp ? '' : `<div class="mock-num">${icon('whatsapp')} WhatsApp: <b>(19) 99999-0000</b></div>`}<div class="mock-btns">${f.whatsapp ? `<span class="ra ra-wa">${icon('whatsapp')}WhatsApp</span>` : ''}<span class="ra">${icon('phone')}Ligar</span>${f.site ? `<span class="ra">${icon('globe')}Site</span>` : ''}${(f.instagram || f.facebook) ? `<span class="mock-soc">${f.instagram ? `<b class="ig">${icon('instagram')}</b>` : ''}${f.facebook ? `<b class="fb">${icon('facebook')}</b>` : ''}</span>` : ''}</div>
  </div>`;
  return `<div class="plan-preview"><div class="pp-col"><small class="pp-label">Assim aparece na busca</small>${row}</div><div class="pp-col"><small class="pp-label">Assim fica a ficha (${p.photos} ${p.photos === 1 ? 'foto' : 'fotos'})</small>${mock}</div></div>

function planBenefitsHTML(id) {

function selectPlan(id) {
  if (!PLANOS[id]) return;

}

/* ==========================================================================
   ROTAS (botão "voltar" do celular funciona)
   #inicio · #buscar?q=…&cat=…&quando=…&bairro=… · #favoritos · #perfil · #empresa/<id>
   ========================================================================== */
let sheetPushed = false;
const hashOf = () => {
  if (current) return `#empresa/${encodeURIComponent(current.id)}`;
  const q = new URLSearchParams();
  if (state.view === 'buscar') {
    if (state.q.trim()) q.set('q', state.q.trim());
    if (state.cat) q.set('cat', state.cat);
    if (state.intent) q.set('quando', state.intent);
    if (state.bairro) q.set('bairro', state.bairro);
  }
  const qs = q.toString();
  return `#${state.view}${qs ? `?${qs}` : ''}`;
};
function pushRoute(mode = 'push') {
  const h = hashOf();
  if (h === location.hash || (!location.hash && h === '#inicio' && mode === 'push')) return;
  try { history[mode === 'push' ? 'pushState' : 'replaceState']({ guia: 1 }, '', h); } catch {}
}

const BASE_TITLE = document.title;
const setTitle = (txt) => { document.title = txt || BASE_TITLE; };

/* De onde veio o visitante: link com ?origem=instagram (ou utm_source). Ajuda a saber qual divulgação funciona. */
function captureOrigin(extra) {
  try {
    const q = new URLSearchParams(location.search);
    const v = extra?.get('origem') || q.get('origem') || q.get('utm_source') || sessionStorage.getItem('guia-busca:origem') || '';
    if (v) { state.origem = v; sessionStorage.setItem('guia-busca:origem', v); }
  } catch {}
}

function applyRoute(initial = false) {
  const raw = location.hash.slice(1), cut = raw.indexOf('?');
  let path = cut < 0 ? raw : raw.slice(0, cut);
  try { path = decodeURIComponent(path); } catch {}
  const params = new URLSearchParams(cut < 0 ? '' : raw.slice(cut + 1));
  if (path === 'participar' || path === 'cadastro') path = 'perfil';
  captureOrigin(params);
  if (path.startsWith('empresa/')) {
    const id = path.slice(8);
    if (COMPANIES.some((x) => x.id === id)) { if (!current || current.id !== id) openCompany(id, 0, { fromRoute: true }); return; }
  }
  const next = {
    view: VIEWS[path] ? path : 'inicio',
    q: path === 'buscar' ? params.get('q') || '' : '',
    cat: path === 'buscar' ? params.get('cat') || '' : '',
    intent: path === 'buscar' ? params.get('quando') || '' : '',
    bairro: path === 'buscar' ? params.get('bairro') || '' : ''
  };
  const same = Object.keys(next).every((k) => state[k] === next[k]);
  if (!$('#veil').hidden) closeCompany({ fromRoute: true });
  if (same && !initial) return;
  Object.assign(state, next);
  render();
  if (!initial) scrollTo({ top: 0 });
}

function openCompany(id, photoIndex = 0, opts = {}) {
  const e = COMPANIES.find((x) => x.id === id);
  if (!e) return;
  current = e; galleryIndex = photoIndex; lastFocus = document.activeElement;
  $('#sheet').innerHTML = sheetHTML(e);
  $('#veil').hidden = false;
  document.body.style.overflow = 'hidden';
  $('#sheet-close').focus();
  setTitle(`${e.name} · ${e.cat} em ${BRAND.city} | ${BRAND.name}`);
  if (!opts.fromRoute) { pushRoute('push'); sheetPushed = true; }
}

function closeCompany(opts = {}) {
  if ($('#veil').hidden) return;
  $('#veil').hidden = true;
  document.body.style.overflow = '';
  current = null;
  setTitle();
  lastFocus?.focus?.();
  if (opts.fromRoute) { sheetPushed = false; return; }
  if (sheetPushed) { sheetPushed = false; history.back(); }
  else pushRoute('replace');
}

function moveGallery(delta) {
  if (!current || current.photos < 2) return;
  galleryIndex = (galleryIndex + delta + current.photos) % current.photos;
  const img = $('#gallery-image');
  img.classList.remove('broken');
  img.src = urlFoto(current.id, galleryIndex, current.ver);
  img.alt = `${current.name}, foto ${galleryIndex + 1}`;
  $('#gallery-count').textContent = `${galleryIndex + 1} / ${current.photos}`;
  $$('.sheet-thumbs .thumb-btn').forEach((b, i) => b.classList.toggle('active', i === galleryIndex));
}

async function shareCompany() {
  if (!current) return;
  const data = { title: current.name, text: `${current.name} · ${current.cat} em ${BRAND.city} (${BRAND.name})`, url: location.href };
  const label = $('#share-company span');
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(location.href); label.textContent = 'Link copiado'; setTimeout(() => label && (label.textContent = 'Compartilhar'), 1800); }
  } catch { /* usuário cancelou */ }
}

function trapFocus(event) {
  const items = $$('a[href],button:not([disabled])', $('#sheet')).filter((n) => n.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}

/* ==========================================================================
   RENDER, NAVEGAÇÃO E TEMA
   ========================================================================== */
const TABS = [['inicio', 'Início', 'house'], ['buscar', 'Buscar', 'search'], ['favoritos', 'Favoritos', 'heart'], ['perfil', 'Para empresas', 'store']];
const VIEWS = { inicio: homeView, buscar: searchView, favoritos: favoritesView, perfil: profileView };

function render() {
  $('#view').innerHTML = (VIEWS[state.view] || homeView)();
  $('#nav').innerHTML = TABS.map(([id, label, ico]) => `<button data-go="${id}" aria-current="${state.view === id ? 'page' : 'false'}">${icon(ico)}${label}</button>`).join('');
  $('#demo-note').hidden = !MODO_DEMO;
  if (new URLSearchParams(location.search).has('debug')) { const n = $('#source-note'); n.hidden = false; n.textContent = `Fonte: ${window.__source || 'dados locais'} · ${COMPANIES.length} empresas`; }
}

function navigate(view) {
  if (view !== 'perfil') state.prefill = null;
  state.view = view;
  render();
  pushRoute('push');
  scrollTo({ top: 0, behavior: 'smooth' });
}

function applyIntent(id) {
  const on = state.intent !== id;
  state.intent = on ? id : '';
  state.view = 'buscar';
  if (id === 'perto' && on && !state.geo) askLocation();
  render();
  pushRoute('replace');
  if (state.view === 'buscar') scrollTo({ top: 0 });
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('#theme-toggle').innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
  $('#theme-toggle').setAttribute('aria-label', theme === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro');
  $('meta[name=theme-color]').content = theme === 'dark' ? '#091225' : '#102448';
}

function toggleFavorite(id) {
  state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
  saveFavs();
  if (state.view === 'favoritos') return render();
  $$(`[data-fav="${CSS.escape(id)}"]`).forEach((b) => {
    const on = state.favs.has(id);
    b.setAttribute('aria-pressed', on);
    b.setAttribute('aria-label', `${on ? 'Remover dos favoritos:' : 'Salvar nos favoritos:'} ${COMPANIES.find((e) => e.id === id)?.name || ''}`);
  });
}

/* ==========================================================================
   EVENTOS
   ========================================================================== */
document.addEventListener('click', (event) => {
  const t = event.target;

  const track = t.closest('[data-track]');
  if (track) registrarContato(track.dataset.id, track.dataset.track, track.dataset.origin || 'public-card');

  if (t.closest('#sheet-close') || t === $('#veil')) return closeCompany();
  if (t.closest('#gallery-prev')) return moveGallery(-1);
  if (t.closest('#gallery-next')) return moveGallery(1);
  if (t.closest('#share-company')) return shareCompany();

  const sheetPhoto = t.closest('[data-sheet-photo]');
  if (sheetPhoto) {
    const idx = Number(sheetPhoto.dataset.sheetPhoto);
    moveGallery(idx - galleryIndex);
    return;
  }

  const claimBtn = t.closest('[data-claim]');
  if (claimBtn) { const c = COMPANIES.find((x) => x.id === claimBtn.dataset.claim); state.prefill = { nome: c?.name || '', origem: 'reivindicacao' }; closeCompany({ fromRoute: true }); return navigate('perfil'); }

  const pop = t.closest('[data-q]');
  if (pop) { state.q = pop.dataset.q; state.view = 'buscar'; render(); pushRoute('push'); return scrollTo({ top: 0 }); }

  if (t.closest('[data-geo]')) { askLocation(); return paintResults(); }

  const go = t.closest('[data-go]');
  if (go) { event.preventDefault(); return navigate(go.dataset.go || 'inicio'); }

  const open = t.closest('[data-open]');
  if (open) return openCompany(open.dataset.open);

  const fav = t.closest('[data-fav]');
  if (fav) return toggleFavorite(fav.dataset.fav);

  const cat = t.closest('[data-cat]');
  if (cat) { state.cat = state.cat === cat.dataset.cat ? '' : cat.dataset.cat; const wasHome = state.view !== 'buscar'; state.view = 'buscar'; render(); pushRoute(wasHome ? 'push' : 'replace'); return wasHome && scrollTo({ top: 0 }); }

  const intent = t.closest('[data-intent]');
  if (intent) return applyIntent(intent.dataset.intent);

  if (t.closest('[data-clear]')) { Object.assign(state, { q: '', cat: '', intent: '', bairro: '', view: 'buscar' }); render(); return pushRoute('replace'); }
});

const maskPhone = (v) => {
  let d = digits(v); if (d.startsWith('55') && d.length > 11) d = d.slice(2);
  d = d.slice(0, 11);
  if (d.length <= 2) return d ? `(${d}` : '';
  if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
};

document.addEventListener('input', (event) => {
  const id = event.target.id;
  if (id === 'r-w') { event.target.value = maskPhone(event.target.value); clearFieldError('r-w'); return; }
  if (id === 'r-n' || id === 'r-ok') clearFieldError(id);
  if (id === 'r-n') { const box = $('#plan-benefits'); if (box) box.innerHTML = planBenefitsHTML(state.plano); }
  if (id !== 'q' && id !== 'global-q') return;
  state.q = event.target.value;
  if (state.view === 'buscar') { paintResults(); pushRoute('replace'); }
  else if (id === 'q') $('#suggestions-slot').innerHTML = suggestions();
});

document.addEventListener('keydown', (event) => {
  const id = event.target.id;
  if ((id === 'q' || id === 'global-q') && event.key === 'Enter') {
    event.preventDefault();
    state.q = event.target.value;
    if (state.view === 'buscar') { paintResults(); return pushRoute('replace'); }
    return navigate('buscar');
  }
  if ($('#veil').hidden) return;
  if (event.key === 'Escape') closeCompany();
  else if (event.key === 'ArrowLeft') moveGallery(-1);
  else if (event.key === 'ArrowRight') moveGallery(1);
  else if (event.key === 'Tab') trapFocus(event);
});

document.addEventListener('change', (event) => {
  if (event.target.id === 'f-bairro') { state.bairro = event.target.value; paintResults(); pushRoute('replace'); return; }
  if (event.target.name === 'r-plano') selectPlan(event.target.value);
  if (event.target.name === 'r-periodo') { state.periodo = Number(event.target.value) || 1; const box = $('#plan-benefits'); if (box) box.innerHTML = planBenefitsHTML(state.plano); }
  if (event.target.id === 'r-c') { const box = $('#plan-benefits'); if (box) box.innerHTML = planBenefitsHTML(state.plano); }
});
document.addEventListener('click', (event) => {
  const card = event.target.closest('[data-plano]');
  if (card) selectPlan(card.dataset.plano);
});

function fieldError(id, msg) {
  const input = $(`#${id}`), err = $(`#${id}-err`);
  if (input && input.type !== 'checkbox') input.setAttribute('aria-invalid', 'true');
  if (err) { err.textContent = msg; err.hidden = false; }
}
function clearFieldError(id) {
  $(`#${id}`)?.removeAttribute('aria-invalid');
  const err = $(`#${id}-err`); if (err) err.hidden = true;
}

document.addEventListener('submit', async (event) => {
  if (event.target.id !== 'reg') return;
  event.preventDefault();
  const nome = $('#r-n').value.trim(), whatsapp = $('#r-w').value.trim(), categoria = $('#r-c').value;
  const plano = $('input[name="r-plano"]:checked')?.value || state.plano || 'gratis';
  ['r-n', 'r-w', 'r-ok'].forEach(clearFieldError);
  let first = '';
  const bad = (id, msg) => { fieldError(id, msg); first = first || id; };
  if (nome.length < 2) bad('r-n', 'Escreva o nome da sua empresa.');
  let d = digits(whatsapp); if (d.startsWith('55') && d.length > 11) d = d.slice(2);
  if (d.length < 10 || d.length > 11) bad('r-w', 'Confira o WhatsApp: DDD + número. Ex.: (19) 99999-0000.');
  else if (d.length === 11 && d[2] !== '9') bad('r-w', 'Celular com 11 números começa com 9 depois do DDD.');
  if (!$('#r-ok').checked) bad('r-ok', 'Marque a caixa para podermos entrar em contato.');
  if (first) { $(`#${first}`).focus(); return; }
  const button = event.target.querySelector('button[type=submit]');
  button.disabled = true; button.textContent = 'Enviando…';
  try { const v = (id) => ($(id)?.value || '').trim();
    await enviarCadastro({ nome, categoria, whatsapp, plano, periodo: plano === 'gratis' ? 1 : state.periodo, aceite: true, origem: state.prefill?.origem || state.origem,
      bairro: v('#r-bairro'), endereco: v('#r-end'), horario: v('#r-hor'), servicos: v('#r-serv'), descricao: v('#r-desc'), telefone: v('#r-tel'), site: v('#r-site'), instagram: v('#r-ig') }); state.sent = true; state.error = false; state.planoEnviado = plano; state.periodoEnviado = state.periodo; state.prefill = null; }
  catch { state.sent = false; state.error = true; }
  render();
  $('#form-msg')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
});

document.addEventListener('error', (event) => {
  if (event.target.tagName === 'IMG') event.target.classList.add('broken');
}, true);

$('#theme-toggle').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', next);
  setTheme(next);
});

/* ==========================================================================
   INICIALIZAÇÃO
   ========================================================================== */
document.querySelectorAll('[data-icon]').forEach((n) => n.insertAdjacentHTML('afterbegin', icon(n.dataset.icon)));
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#view').innerHTML = '<div class="loading">Carregando empresas...</div>';

/* Marca e cidade vêm de config.js: trocar lá basta para abrir outra cidade ou segmento. */
(() => {
  const parts = BRAND.name.trim().split(/\s+/), last = parts.pop();
  $('#brand-name').innerHTML = `${esc(parts.join(' '))} <em>${esc(last)}</em>`;
  $('#brand-sub').textContent = `${BRAND.segmento && BRAND.segmento !== 'Cidade' ? `${BRAND.segmento} · ` : ''}${BRAND.city}`;
  $('#city-chip').textContent = `${BRAND.city}, ${BRAND.uf}`;
  $('#footer-brand').textContent = BRAND.name;
  $('#footer-sub').textContent = `Guia de empresas e serviços de ${BRAND.city}`;
  $('.brand')?.setAttribute('aria-label', `${BRAND.name}, início`);
})();

/* Dados estruturados para o Google (só com dados reais; no modo demonstração não publica telefones fictícios). */
function injectSchema() {
  if (MODO_DEMO) return;
  const base = (BRAND.siteUrl || location.origin).replace(/\/$/, '');
  const data = { '@context': 'https://schema.org', '@type': 'ItemList', itemListElement: COMPANIES.map((e, i) => ({
    '@type': 'ListItem', position: i + 1, item: {
      '@type': 'LocalBusiness', name: e.name, url: `${base}/#empresa/${encodeURIComponent(e.id)}`, telephone: e.phone ? `+55${digits(e.phone).replace(/^55/, '')}` : undefined,
      image: urlFoto(e.id, 0, e.ver), address: { '@type': 'PostalAddress', streetAddress: e.end, addressLocality: BRAND.city, addressRegion: BRAND.uf, addressCountry: 'BR' },
      ...(e.location ? { geo: { '@type': 'GeoCoordinates', latitude: e.location.lat, longitude: e.location.lng } } : {})
    } })) };
  const tag = document.createElement('script'); tag.type = 'application/ld+json'; tag.textContent = JSON.stringify(data);
  document.head.appendChild(tag);
}

window.addEventListener('popstate', () => applyRoute());

(async () => {
  try {
    const [negocios, conteudo] = await Promise.all([carregarNegocios(), carregarConteudo()]);
    COMPANIES = negocios.lista;
    window.__source = negocios.fonte;
    CONTENT = conteudo;
  } catch (error) {
    console.error(error);
    $('#view').innerHTML = '<div class="loading">Não foi possível carregar o guia agora. Atualize a página em instantes.</div>';
    return;
  }
  injectSchema();
  render();
  applyRoute(true);
})();
</script>
</body>
</html>
