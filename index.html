<style>
/* ==========================================================================
   1. TOKENS
   ========================================================================== */
:root{
  --bg:#f7f5f1; --surface:#fffdfa; --surface-2:#f1eee8;
  --ink:#102448; --muted:#6f7890; --line:#e6e4de;
  --navy:#102448; --navy-2:#17396b;
  --coral:#e66a4e; --coral-2:#f4a488;
  --green:#168b59; --amber:#c4933d; --purple:#7355c5;
  --blue:#4688db; --mint:#1aa27a; --rose:#d85c8a; --sky:#43a0bd; --lime:#67a52c; --orange:#e6873c;
  --shadow:0 18px 50px rgba(16,36,72,.1);
  --shadow-sm:0 6px 20px rgba(16,36,72,.08);
  --display:"Cormorant Garamond",Georgia,serif;
  --body:"Figtree",system-ui,sans-serif;
  --max:1180px;
  --header-h:78px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#091225; --surface:#111d36; --surface-2:#172744;
  --ink:#f4f0e7; --muted:#aab4ca; --line:#263657;
  --navy:#e5bd72; --navy-2:#f0d598;
  --coral:#f18a6b; --coral-2:#f6b49b;
  --green:#57d69a; --amber:#edc77a; --purple:#b2a0f7;
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --shadow-sm:0 6px 20px rgba(0,0,0,.2);
  color-scheme:dark;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; padding-bottom:80px; color:var(--ink); font:15px/1.5 var(--body);
  background:radial-gradient(900px 400px at 50% -140px,color-mix(in srgb,var(--coral) 10%,transparent),transparent 72%),var(--bg);
}
button,input,select,textarea{font:inherit}
button,a{color:inherit}
button{cursor:pointer}
a{text-decoration:none}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}

.wrap{max-width:var(--max);margin:0 auto;padding:0 22px}
.sr{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--coral);text-transform:uppercase}
.ico{width:1.2em;height:1.2em;flex:none}
img.broken{opacity:.15}

/* ==========================================================================
   3. CABEÇALHO E NAVEGAÇÃO
   ========================================================================== */
.site-header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
.header-inner{min-height:var(--header-h);display:flex;align-items:center;gap:18px}

.brand-name{display:block;font:700 28px/1 var(--display);letter-spacing:.01em}
.brand-name em{font-style:italic;color:var(--coral)}
.brand small{display:block;margin-top:4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.header-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.city-chip,.icon-btn{border:1px solid var(--line);background:var(--surface);min-height:42px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 13px;color:var(--muted);font-weight:600}
.city-chip .ico,.icon-btn .ico{color:var(--coral)}
.city-chip strong{color:var(--ink)}
.icon-btn{width:42px;padding:0}

.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;font-size:11px;font-weight:700}
.tabbar .ico{width:21px;height:21px}
.tabbar button[aria-current=page]{color:var(--coral)}

main{min-height:calc(100vh - var(--header-h))}

/* ==========================================================================

.hero{padding:74px 0 38px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(300px,.92fr);gap:50px;align-items:center}
.hero h1{font:700 clamp(42px,6vw,76px)/.92 var(--display);letter-spacing:-.035em;margin:14px 0 20px;max-width:660px}
.hero h1 em{font-style:italic;color:var(--coral)}
.hero .lead{font-size:18px;color:var(--muted);max-width:550px;margin:0 0 25px}

.hero-art{position:relative;aspect-ratio:1;border-radius:34px;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--navy-2));box-shadow:var(--shadow)}

.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-art .city-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-art.has-image::before,.hero-art.has-image svg{display:none}
.hero-art-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,45,.04) 25%,rgba(8,20,45,.78) 100%);pointer-events:none}
.hero-note{position:absolute;left:24px;bottom:23px;max-width:230px;color:#fff}
.hero-note strong{display:block;font:700 28px/1 var(--display)}
.hero-note span{display:block;margin-top:6px;color:#f7d9b6;font-size:13px}

.hero-search{position:relative;z-index:2;display:flex;align-items:center;gap:10px;max-width:640px;border:1px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:var(--shadow-sm);padding:5px 7px 5px 17px}
.hero-search>.ico{width:23px;height:23px;color:var(--coral)}
.hero-search input{width:100%;border:0;background:transparent;color:var(--ink);outline:0;font-size:17px;padding:13px 0}
.hero-search input::placeholder{color:var(--muted)}
.btn-send{border:0;background:var(--coral);color:#fff;border-radius:13px;min-height:45px;padding:0 17px;font-weight:800}
.suggestions{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:7px;box-shadow:var(--shadow)}
.suggestions button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:var(--ink);border-radius:10px;padding:10px}
.suggestions button:hover{background:var(--surface-2)}
.suggestions small{display:block}

.global-search{display:flex;align-items:center;margin-top:22px}
.global-search label{display:contents}
.global-search .gs-icon{height:46px;display:grid;place-items:center;padding:0 4px 0 15px;border:1px solid var(--line);border-right:0;border-radius:14px 0 0 14px;background:var(--surface);color:var(--coral)}
.global-search input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-left:0;border-radius:0 14px 14px 0;background:var(--surface);color:var(--ink);padding:0 12px;outline:0}
.global-search:focus-within{filter:drop-shadow(0 7px 15px rgba(16,36,72,.08))}
.global-search input::placeholder{color:var(--muted)}
.global-search .btn-go{height:36px;margin-left:-52px;border:0;border-radius:10px;background:var(--coral);color:#fff;padding:0 14px;font-weight:800;z-index:1}

/* ==========================================================================
   5. SEÇÕES, ATALHOS E CATEGORIAS
   ========================================================================== */
.section{padding:25px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}

.section-head p{margin:5px 0 0;color:var(--muted)}
