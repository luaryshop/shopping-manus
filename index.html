<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viva Ira · Guia local de Iracemápolis</title>
<meta name="description" content="Encontre empresas, serviços e soluções de Iracemápolis com contato direto, informações claras e confiança local.">
<meta name="theme-color" content="#102448">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   1. TOKENS
   ========================================================================== */
:root{
  --bg:#f7f5f1; --surface:#fffdfa; --surface-2:#f1eee8;
  --ink:#102448; --muted:#6f7890; --line:#e6e4de;
  --navy:#102448; --navy-2:#17396b;
  --coral:#e66a4e; --coral-2:#f4a488;
  --green:#168b59; --amber:#c4933d; --purple:#7355c5;
  --blue:#4688db; --mint:#1aa27a; --rose:#d85c8a; --sky:#43a0bd; --lime:#67a52c; --orange:#e6873c;
  --shadow:0 18px 50px rgba(16,36,72,.1);
  --shadow-sm:0 6px 20px rgba(16,36,72,.08);
  --display:"Cormorant Garamond",Georgia,serif;
  --body:"Figtree",system-ui,sans-serif;
  --max:1180px;
  --header-h:78px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#091225; --surface:#111d36; --surface-2:#172744;
  --ink:#f4f0e7; --muted:#aab4ca; --line:#263657;
  --navy:#e5bd72; --navy-2:#f0d598;
  --coral:#f18a6b; --coral-2:#f6b49b;
  --green:#57d69a; --amber:#edc77a; --purple:#b2a0f7;
  --shadow:0 18px 50px rgba(0,0,0,.28);
  --shadow-sm:0 6px 20px rgba(0,0,0,.2);
  color-scheme:dark;
}

/* ==========================================================================
   2. BASE
   ========================================================================== */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; padding-bottom:80px; color:var(--ink); font:15px/1.5 var(--body);
  background:radial-gradient(900px 400px at 50% -140px,color-mix(in srgb,var(--coral) 10%,transparent),transparent 72%),var(--bg);
}
button,input,select,textarea{font:inherit}
button,a{color:inherit}
button{cursor:pointer}
a{text-decoration:none}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}

.wrap{max-width:var(--max);margin:0 auto;padding:0 22px}
.sr{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;white-space:nowrap!important}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--coral);text-transform:uppercase}
.ico{width:1.2em;height:1.2em;flex:none}
img.broken{opacity:.15}

/* ==========================================================================
   3. CABEÇALHO E NAVEGAÇÃO
   ========================================================================== */
.site-header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid color-mix(in srgb,var(--line) 75%,transparent)}
.header-inner{min-height:var(--header-h);display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--navy),var(--navy-2));box-shadow:0 7px 16px color-mix(in srgb,var(--navy) 22%,transparent)}
.brand-mark svg{width:28px;height:28px;color:var(--coral-2)}
.brand-name{display:block;font:700 28px/1 var(--display);letter-spacing:.01em}
.brand-name em{font-style:italic;color:var(--coral)}
.brand small{display:block;margin-top:4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.header-tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.city-chip,.icon-btn{border:1px solid var(--line);background:var(--surface);min-height:42px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 13px;color:var(--muted);font-weight:600}
.city-chip .ico,.icon-btn .ico{color:var(--coral)}
.city-chip strong{color:var(--ink)}
.icon-btn{width:42px;padding:0}

.tabbar{position:fixed;z-index:31;inset:auto 0 0 0;display:flex;justify-content:space-around;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;font-size:11px;font-weight:700}
.tabbar .ico{width:21px;height:21px}
.tabbar button[aria-current=page]{color:var(--coral)}

main{min-height:calc(100vh - var(--header-h))}

/* ==========================================================================
   4. HERO E BUSCA
   ========================================================================== */
.hero{padding:74px 0 38px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(300px,.92fr);gap:50px;align-items:center}
.hero h1{font:700 clamp(42px,6vw,76px)/.92 var(--display);letter-spacing:-.035em;margin:14px 0 20px;max-width:660px}
.hero h1 em{font-style:italic;color:var(--coral)}
.hero .lead{font-size:18px;color:var(--muted);max-width:550px;margin:0 0 25px}

.hero-art{position:relative;aspect-ratio:1;border-radius:34px;overflow:hidden;background:linear-gradient(135deg,var(--navy),var(--navy-2));box-shadow:var(--shadow)}
.hero-art::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 22%,color-mix(in srgb,var(--coral) 75%,transparent),transparent 28%),radial-gradient(circle at 18% 100%,color-mix(in srgb,var(--amber) 50%,transparent),transparent 35%)}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
.hero-art .city-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-art.has-image::before,.hero-art.has-image svg{display:none}
.hero-art-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,20,45,.04) 25%,rgba(8,20,45,.78) 100%);pointer-events:none}
.hero-note{position:absolute;left:24px;bottom:23px;max-width:230px;color:#fff}
.hero-note strong{display:block;font:700 28px/1 var(--display)}
.hero-note span{display:block;margin-top:6px;color:#f7d9b6;font-size:13px}

.hero-search{position:relative;z-index:2;display:flex;align-items:center;gap:10px;max-width:640px;border:1px solid var(--line);background:var(--surface);border-radius:18px;box-shadow:var(--shadow-sm);padding:5px 7px 5px 17px}
.hero-search>.ico{width:23px;height:23px;color:var(--coral)}
.hero-search input{width:100%;border:0;background:transparent;color:var(--ink);outline:0;font-size:17px;padding:13px 0}
.hero-search input::placeholder{color:var(--muted)}
.btn-send{border:0;background:var(--coral);color:#fff;border-radius:13px;min-height:45px;padding:0 17px;font-weight:800}
.suggestions{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:7px;box-shadow:var(--shadow)}
.suggestions button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:transparent;color:var(--ink);border-radius:10px;padding:10px}
.suggestions button:hover{background:var(--surface-2)}
.suggestions small{display:block}

.global-search{display:flex;align-items:center;margin-top:22px}
.global-search label{display:contents}
.global-search .gs-icon{height:46px;display:grid;place-items:center;padding:0 4px 0 15px;border:1px solid var(--line);border-right:0;border-radius:14px 0 0 14px;background:var(--surface);color:var(--coral)}
.global-search input{flex:1;min-width:0;height:46px;border:1px solid var(--line);border-left:0;border-radius:0 14px 14px 0;background:var(--surface);color:var(--ink);padding:0 12px;outline:0}
.global-search:focus-within{filter:drop-shadow(0 7px 15px rgba(16,36,72,.08))}
.global-search input::placeholder{color:var(--muted)}
.global-search .btn-go{height:36px;margin-left:-52px;border:0;border-radius:10px;background:var(--coral);color:#fff;padding:0 14px;font-weight:800;z-index:1}

/* ==========================================================================
   5. SEÇÕES, ATALHOS E CATEGORIAS
   ========================================================================== */
.section{padding:25px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-head h2{font:700 37px/1 var(--display);letter-spacing:-.02em;margin:0}
.section-head h2 em{font-style:italic;color:var(--coral)}
.section-head p{margin:5px 0 0;color:var(--muted)}
.section-link{border:0;background:transparent;color:var(--coral);font-weight:800;white-space:nowrap}

.intents{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.intent{min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:800;box-shadow:var(--shadow-sm);transition:transform .22s,border-color .22s,box-shadow .22s}
.intent:hover,.intent[aria-pressed=true]{transform:translateY(-3px);border-color:var(--coral);box-shadow:var(--shadow)}
.intent-icon{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:var(--tone,var(--coral));background:color-mix(in srgb,var(--tone,var(--coral)) 13%,transparent)}
.intent-icon .ico{width:20px;height:20px}
.intent small{display:block;margin-top:1px;color:var(--muted);font-weight:500;font-size:11px;line-height:1.25}
.intent-aberto,.filter-aberto{--tone:#168b59}
.intent-emergencia,.filter-emergencia{--tone:#c55245}
.intent-delivery,.filter-delivery{--tone:#4788d9}
.intent-perto,.filter-perto{--tone:#b18028}

.category-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:10px}
.category{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:13px 8px 11px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:12px;text-align:center;transition:transform .22s,border-color .22s,box-shadow .22s,color .22s}
.category:hover,.category[aria-pressed=true]{color:var(--ink);border-color:var(--coral);transform:translateY(-4px);box-shadow:var(--shadow-sm)}
.cat-icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--surface-2);color:var(--tone,var(--coral))}
.cat-icon .ico{width:23px;height:23px}
.category[data-color=blue]{--tone:var(--blue)}   .category[data-color=mint]{--tone:var(--mint)}
.category[data-color=amber]{--tone:var(--amber)} .category[data-color=violet]{--tone:var(--purple)}
.category[data-color=rose]{--tone:var(--rose)}   .category[data-color=sky]{--tone:var(--sky)}
.category[data-color=lime]{--tone:var(--lime)}   .category[data-color=orange]{--tone:var(--orange)}

/* ==========================================================================
   6. BLOCOS FIXOS
   ========================================================================== */
.banners-fixed{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:15px 0 10px}
.banner-card{position:relative;overflow:hidden;border-radius:24px;padding:26px 28px;color:#fff;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:center;min-height:180px;transition:transform .22s,box-shadow .22s}
.banner-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.banner-card::after{content:"";position:absolute;right:-10%;bottom:-40%;width:60%;height:160%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--coral) 80%,transparent),transparent 65%);pointer-events:none}
.banner-card[data-color=navy]{background:linear-gradient(120deg,#102448,#1b477d)}
.banner-card[data-color=coral]{background:linear-gradient(120deg,#b94e38,#e66a4e)}
.banner-card .eyebrow{color:#ffd1a6;margin-bottom:6px}
.banner-card h2{position:relative;z-index:1;font:700 clamp(22px,2.5vw,30px)/1.05 var(--display);margin:4px 0 8px}
.banner-card p{position:relative;z-index:1;color:#f7e4d3;margin:0 0 16px;font-size:13px;line-height:1.4}
.banner-card a{position:relative;z-index:2;align-self:flex-start;border-radius:999px;background:#fff;color:#132b52;padding:9px 15px;font-weight:800;font-size:13px}

/* ==========================================================================
   7. CARDS DE EMPRESA, MINI FOTOS & GRID
   ========================================================================== */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:stretch}
.business-card{position:relative;overflow:hidden;min-width:0;height:100%;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow-sm);transition:transform .26s,box-shadow .26s,border-color .26s}
.business-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--coral) 45%,var(--line))}
.cover{position:relative;display:block;flex:none;width:100%;aspect-ratio:1;overflow:hidden;border:0;padding:0;background:var(--surface)}
.cover img{width:100%;height:100%;display:block;object-fit:contain;transition:transform .6s;background:var(--surface)}
.business-card:hover .cover img{transform:scale(1.06)}
.cover::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(8,20,45,.65))}
.badge{position:absolute;z-index:1;left:11px;top:11px;display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.9);color:#15315c;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.badge.premium{background:var(--amber);color:#32220a}
.badge.verified{left:auto;right:11px;background:var(--green);color:#fff}
.save{position:absolute;z-index:2;right:10px;top:53px;width:35px;height:35px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(9,22,45,.5);color:#fff;backdrop-filter:blur(7px)}
.save[aria-pressed=true]{background:#fff;color:var(--coral)}
.save[aria-pressed=true] .ico{fill:currentColor}
.save .ico{width:17px;height:17px}

/* Mini Fotos (Thumbnails) nos Cards */
.card-thumbs{display:flex;gap:6px;padding:10px 15px 0;overflow-x:auto;scrollbar-width:none}
.card-thumbs::-webkit-scrollbar{display:none}
.thumb-btn{width:36px;height:36px;flex:none;padding:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);cursor:pointer;transition:border-color .2s,transform .15s}
.thumb-btn:hover,.thumb-btn.active{border-color:var(--coral);transform:scale(1.06)}
.thumb-btn img{width:100%;height:100%;object-fit:cover;display:block}

.card-body{display:flex;flex-direction:column;flex-grow:1;min-width:0;padding:15px}
.card-body h3{margin:0;font:700 22px/1.2 var(--display);letter-spacing:-.01em;overflow-wrap:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:6px;min-width:0;color:var(--muted);font-size:12px}
.card-meta>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-desc{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;margin:10px 0;color:var(--muted);font-size:13px;line-height:1.4}
.card-location{display:flex;align-items:center;gap:5px;margin-top:auto;min-width:0;color:var(--muted);font-size:12px}
.card-location .ico{width:15px;height:15px;color:var(--coral)}
.card-location span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{min-height:37px;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn .ico{width:15px;height:15px}

/* Botão WhatsApp (Verde) */
.btn-wa {
  background: var(--green);
  border-color: var(--green);
  color: #ffffff !important;
}

/* Botão Ligar (Azul) - Modo Claro e Escuro */
[data-track="ligar"] {
  background: #1e40af;
  border-color: #1e40af;
  color: #ffffff !important;
}
:root[data-theme=dark] [data-track="ligar"] {
  background: #2563eb;
  border-color: #2563eb;
  color: #ffffff !important;
}

/* Botão Compartilhar (Roxo) - Modo Claro e Escuro */
#share-company {
  background: #6b21a8;
  border-color: #6b21a8;
  color: #ffffff !important;
}
:root[data-theme=dark] #share-company {
  background: #7c3aed;
  border-color: #7c3aed;
  color: #ffffff !important;
}

.open-status{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;font-weight:800;color:var(--green)}
.open-status.closed{color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.rating-label{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.rating-score{color:var(--ink)}
.rating-score strong{color:var(--amber);font-weight:800}
.rating-new{color:var(--coral);font-weight:700}
.rating-empty{color:var(--muted);font-weight:600}

/* ==========================================================================
   8. PAINÉIS, NOTÍCIAS, CTA
   ========================================================================== */
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.panel{border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:21px;box-shadow:var(--shadow-sm)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:15px}
.panel-head>div{min-width:0}
.panel-head>.ico{width:58px;height:58px;color:var(--coral);stroke-width:1.55}
.panel h3{max-width:15ch;margin:0;font:700 29px/1.05 var(--display)}
.panel-head p{max-width:32ch;margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}

.nearby-list{display:grid;gap:8px}
.nearby-row{min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:9px;background:var(--surface-2);text-align:left}
.nearby-row .mini-cover{width:44px;height:44px;flex:none;border-radius:12px;object-fit:cover;background:var(--surface)}
.nearby-row .txt{min-width:0;flex:1}
.nearby-row strong,.nearby-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nearby-row strong{font-size:13px}
.nearby-row small{color:var(--muted);font-size:11px}
.nearby-row .rank{margin-left:auto;color:var(--amber);font-weight:800}

.emergency{background:linear-gradient(135deg,#311c2a,#5c2e37);color:#fff;border:0}
.emergency .panel-head p{color:#f5c7bc}
.emergency .panel-head>.ico{color:#ffe8dc}
.plantao-card{width:100%;min-width:0;display:flex;align-items:flex-start;gap:12px;margin-top:8px;padding:12px;border:1px solid rgba(255,255,255,.16);border-radius:14px;background:rgba(255,255,255,.1);color:#fff;text-align:left}
.plantao-card:hover{background:rgba(255,255,255,.17)}
.plantao-icon{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:13px;background:rgba(255,255,255,.12);color:#ffc283}
.plantao-card .txt{min-width:0;flex:1}
.plantao-card strong,.plantao-card small{display:block;overflow-wrap:anywhere;line-height:1.35}
.plantao-card small{margin-top:3px;font-size:11px;color:#f4d9d0}
.arrow-link{flex:none;color:#ffc283;font-size:24px}
.emergency-count{margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.14);font-size:12px;color:#f4d9d0}

.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.news-card{position:relative;overflow:hidden;min-height:170px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:19px}
.news-card::after{content:"";position:absolute;right:-25px;bottom:-40px;width:110px;height:110px;border-radius:50%;background:color-mix(in srgb,var(--coral) 9%,transparent)}
.news-card .eyebrow{font-size:10px}
.news-card h3{margin:13px 0 8px;font:700 24px/1 var(--display)}
.news-card p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:13px}

.cta-business{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:17px 0;padding:23px 27px;border-radius:24px;background:linear-gradient(110deg,var(--navy),var(--navy-2));color:#fff}
:root[data-theme=dark] .cta-business{color:#091225}
.cta-business h2{margin:0;font:700 30px/1 var(--display)}
.cta-business p{margin:6px 0 0;opacity:.8}
.cta-business a{background:var(--coral);color:#fff;border-radius:999px;padding:12px 17px;font-weight:800;white-space:nowrap}

/* ==========================================================================
   9. BUSCA, FILTROS, FAVORITOS, CADASTRO
   ========================================================================== */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.filter-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px;font-weight:700}
.filter-chip .ico{width:17px;height:17px;color:var(--tone,var(--coral))}
.filter-chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.filter-clear{color:var(--coral);background:color-mix(in srgb,var(--coral) 8%,var(--surface))}
.result-count{color:var(--muted);font-size:13px}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:22px;padding:46px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty .ico{width:40px;height:40px;color:var(--coral);margin-bottom:8px}

.profile-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
.form-card{max-width:650px;border:1px solid var(--line);border-radius:24px;padding:22px;background:var(--surface);box-shadow:var(--shadow-sm)}
.form-card label{display:grid;gap:6px;margin-bottom:13px;font-weight:700;font-size:13px}
.form-card input,.form-card select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.form-card button{width:100%;border:0;border-radius:12px;background:var(--coral);color:#fff;padding:13px;font-weight:800}
.form-card button:disabled{opacity:.6;cursor:progress}
.notice{margin-bottom:14px;padding:11px;border-radius:12px}
.notice.ok{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.notice.err{background:color-mix(in srgb,var(--coral) 12%,transparent);color:var(--coral)}
.plans-mini{display:grid;gap:10px;align-content:start}
.plan-mini{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:16px}
.plan-mini h3{margin:0;font:700 23px/1 var(--display)}
.plan-mini strong{color:var(--coral);font-size:13px}
.plan-mini p{margin:5px 0 0;color:var(--muted);font-size:12px}

.loading{padding:90px 0;text-align:center;color:var(--muted)}

/* ==========================================================================
   10. MODAL DA EMPRESA
   ========================================================================== */
.veil{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(7,14,30,.72)}
.sheet{position:relative;width:min(960px,100%);height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden;border-radius:26px;background:var(--surface);box-shadow:var(--shadow)}
.sheet-close{position:absolute;z-index:5;top:14px;right:14px;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.sheet-close .ico{width:20px;height:20px}

.sheet-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sheet-media{min-width:0;display:flex;align-items:center;justify-content:center;background:#081631}
.sheet-gallery{position:relative;width:min(100%,calc(100dvh - 190px));aspect-ratio:1;overflow:hidden}
.sheet-gallery img{width:100%;height:100%;display:block;object-fit:contain}
.gallery-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;pointer-events:none}
.gallery-nav button{pointer-events:auto;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#102448}
.gallery-count{position:absolute;right:14px;bottom:14px;border-radius:999px;background:rgba(6,16,35,.72);color:#fff;font-size:12px;padding:5px 10px}

.sheet-info{min-width:0;overflow-y:auto;padding:30px 28px 28px}
.sheet-info h2{margin:0 52px 9px 0;font:700 42px/.95 var(--display);overflow-wrap:anywhere}
.sheet-info p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.category-line{color:var(--muted);font-size:13px}
.detail-status{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}
.detail-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:7px 10px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:700}
.detail-pill .ico{width:15px;height:15px}
.detail-pill.live,.detail-pill.verify{color:var(--green)}
.detail-block{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.detail-block h3{margin:0 0 10px;font:700 24px/1 var(--display)}
.detail-row{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;font-size:13px}
.detail-row b{color:var(--muted)}
.service-list{display:grid;gap:7px}
.service{display:flex;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:1px dashed var(--line);font-size:13px}
.service small{color:var(--coral);font-weight:800;white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.links a .ico{width:16px;height:16px}
.links .waze-link{color:#4878ff;border-color:color-mix(in srgb,#4878ff 35%,var(--line));background:color-mix(in srgb,#4878ff 7%,transparent)}
.hours{display:grid;gap:8px;font-size:13px}
.hours-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:9px 11px}
.hours-row span{color:var(--muted)}
.hours-row strong{text-align:right;white-space:nowrap}

.sheet-actions{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.sheet-actions .btn{min-height:46px;border-radius:13px;font-size:13px;gap:7px}
.sheet-actions .btn .ico{width:17px;height:17px}

footer{max-width:var(--max);margin:50px auto 0;padding:25px 22px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px}
.footer-brand{font:700 21px var(--display);color:var(--ink)}
footer a{color:var(--coral);font-weight:700}

/* ==========================================================================
   11. RESPONSIVO
   ========================================================================== */
@media(min-width:900px){
  body{padding-bottom:0}
  .tabbar{position:static;max-width:var(--max);margin:0 auto 6px;padding:0 22px;justify-content:flex-start;gap:7px;background:transparent;border:0;backdrop-filter:none}
  .tabbar button{flex:none;flex-direction:row;gap:7px;border:1px solid transparent;border-radius:999px;padding:9px 13px;font-size:13px}
  .tabbar button[aria-current=page]{background:var(--surface);border-color:var(--line)}
}

@media(max-width:1100px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .category-grid{grid-template-columns:repeat(5,1fr)}
  .hero{gap:28px}
  .panel{padding:18px}
  .panel-head>.ico{width:50px;height:50px}
}

@media(max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:48px}
  .hero-art{aspect-ratio:16/11}
  .split,.profile-layout{grid-template-columns:1fr}
  .news-grid{grid-template-columns:1fr 1fr}

  /* modal em tela cheia */
  .veil{padding:0}
  .sheet{width:100%;height:100dvh;border-radius:0}
  .sheet-main{display:block;overflow-y:auto}
  .sheet-media{display:block}
  .sheet-gallery{width:100%}
  .sheet-info{overflow:visible;padding:22px 20px 28px}
  .sheet-info h2{font-size:36px}
  .sheet-close{top:max(14px,env(safe-area-inset-top))}
}

@media(max-width:560px){
  body{font-size:14px}
  :root{--header-h:64px}
  .wrap{padding:0 14px}
  .header-inner{min-height:64px}
  .brand-mark{width:38px;height:38px}
  .brand-name{font-size:24px}
  .header-tools{gap:5px}
  .icon-btn{min-height:38px;width:38px}
  .hero{padding-top:32px;gap:18px}
  .hero h1{font-size:45px;line-height:.94}
  .hero-art{border-radius:24px}
  .section{padding:19px 0}
  .section-head{display:block}
  .section-head h2{font-size:30px}
  .section-link{display:inline-block;margin-top:8px;padding:0}
  .intents{grid-template-columns:1fr 1fr;gap:8px}
  .intent{min-height:70px;padding:10px;align-items:flex-start;font-size:12px}
  .intent-icon{width:38px;height:38px}
  .intent small{font-size:10px}
  .category-grid{gap:7px}
  .category{padding:10px 5px;font-size:11px}
  .cat-icon{width:38px;height:38px}
  .grid{grid-template-columns:1fr;gap:14px}
  .card-thumbs{padding:8px 10px 0;gap:4px}
  .thumb-btn{width:30px;height:30px;border-radius:6px}
  .split{gap:12px}
  .panel{padding:16px;border-radius:20px}
  .panel-head{gap:9px;margin-bottom:12px}
  .panel h3{font-size:27px}
  .panel-head p{font-size:12px}
  .panel-head>.ico{width:44px;height:44px}
  .nearby-row{padding:8px}
  .nearby-row .mini-cover{width:42px;height:42px}
  .global-search{margin-top:14px}
  .global-search .gs-icon{height:42px;padding-left:11px}
  .global-search input{height:42px;font-size:13px}
  .global-search .btn-go{height:36px;margin-left:-46px;padding:0 10px;font-size:12px}
  .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .filter-chip{min-height:42px;justify-content:flex-start;padding:0 11px}
  .rating-label{white-space:normal}
  .sheet-info h2{font-size:33px}
  .sheet-actions{padding-left:10px;padding-right:10px}
  .sheet-actions .btn{font-size:12px}
  .hours-row{grid-template-columns:minmax(0,1fr) minmax(92px,auto);padding:9px;font-size:12px}
}

@media(max-width:360px){
  .brand-name{font-size:22px}
  .intent{font-size:11px}
  .panel h3{font-size:25px}
  .plantao-card{gap:8px}
  .sheet-actions{gap:5px}
  .sheet-actions .btn{padding-left:4px;padding-right:4px}
  .hours-row{grid-template-columns:1fr;gap:2px}
  .hours-row strong{text-align:left}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

<body>
<header class="site-header">
  <div class="header-inner wrap">
    <a class="brand" href="#inicio" data-go="inicio" aria-label="Viva Ira, início">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/><path d="M4 18.5h16" opacity=".55"/></svg></span>
      <span><strong class="brand-name">Viva <em>Ira</em></strong><small>Guia local de Iracemápolis</small></span>
    </a>
    <div class="header-tools">
      <span class="city-chip" data-icon="pin"><strong>Iracemápolis, SP</strong></span>
      <button class="icon-btn" id="theme-toggle" type="button"></button>
    </div>
  </div>
</header>

<nav class="tabbar" id="nav" aria-label="Navegação principal"></nav>
<main class="wrap" id="view" aria-live="polite"></main>

<footer>
  <div><div class="footer-brand">Viva Ira</div><div id="source-note">Carregando dados locais...</div></div>
  <div><a href="#perfil" data-go="perfil">Sua empresa no guia</a><br><span>Um projeto de demonstração para Iracemápolis</span></div>
</footer>

<div class="veil" id="veil" hidden>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>

<script type="module">
import { carregarNegocios, carregarConteudo, registrarContato, urlFoto, enviarCadastro } from './ira-data.js';
import { BRAND, CATEGORIAS, INTENCOES, PLANOS } from './config.js';

/* ==========================================================================
   ÍCONES
   ========================================================================== */
const PATHS = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  siren:'<path d="M6 18h12M8 18v-5a4 4 0 0 1 8 0v5M5 10h14M12 3v2M4.7 5.2 6 6.5M19.3 5.2 18 6.5"/>',
  truck:'<path d="M3 6h10v10H3zM13 10h4l4 3v3h-8"/><circle cx="7" cy="18" r="1.7"/><circle cx="17" cy="18" r="1.7"/>',
  store:'<path d="M4 10h16v10H4zM3 10l2-6h14l2 6M8 10v3M12 10v3M16 10v3M8 20v-5h8v5"/>',
  tool:'<path d="m14 6 4 4M5 19l9-9 4 4-9 9H5v-4Z"/><path d="M15 5a4 4 0 0 1 5 5"/>',
  'heart-pulse':'<path d="M20 8c0 5-8 11-8 11S4 13 4 8a4 4 0 0 1 7-2 4 4 0 0 1 7 2Z"/><path d="M7 10h2l1.2-2.4L12 14l1.4-3H16"/>',
  utensils:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/>',
  house:'<path d="m4 11 8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>',
  sparkle:'<path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z"/><path d="m19 16 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22V5.5Z"/><path d="M4 18a2.5 2.5 0 0 1 2.5-2.5H20"/>',
  paw:'<circle cx="7" cy="8" r="2"/><circle cx="17" cy="8" r="2"/><circle cx="5" cy="14" r="2"/><circle cx="19" cy="14" r="2"/><path d="M12 11c-3 0-5 5-2 7 1.5 1 2.5-1 4 0 3 2 4-2 2-4-1.1-1.4-2-3-4-3Z"/>',
  party:'<path d="m4 20 8-15 8 15H4Z"/><path d="M12 3v2M5 7l1.5 1M19 7l-1.5 1"/>',
  heart:'<path d="M20 8c0 5-8 11-8 11S4 13 4 8a4 4 0 0 1 7-2 4 4 0 0 1 7 2Z"/>',
  phone:'<path d="M6 3h3l2 5-2.2 1.3a12 12 0 0 0 5.9 5.9L16 13l5 2v3a2 2 0 0 1-2 2C10.7 20 4 13.3 4 5a2 2 0 0 1 2-2Z"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.6A8 8 0 1 1 21 12Z"/>',
  share:'<circle cx="18" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="m8 11 8-5M8 13l8 5"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1 6.3 17.7M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 15.5A8 8 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/>',
  check:'<path d="m5 12 4 4L19 6"/>',
  route:'<path d="M5 19h14M7 16l5-5 5 5M12 11V4M9 7l3-3 3 3"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="19" r="1.5"/>',
  waze:'<path d="M12 3a7 7 0 0 0-7 7c0 4 3 5 3 8h8c0-3 3-4 3-8a7 7 0 0 0-7-7Z"/><path d="M9 14h6M10 18h4M9.5 9.5h.01M14.5 9.5h.01"/>',
  x:'<path d="m6 6 12 12M18 6 6 18"/>',
  'chev-l':'<path d="m15 18-6-6 6-6"/>',
  'chev-r':'<path d="m9 18 6-6-6-6"/>'
};
const icon = (name, cls = '') =>
  `<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PATHS[name] || PATHS.sparkle}</svg>`;

/* ==========================================================================
   UTILITÁRIOS
   ========================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const norm = (s = '') => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const digits = (s = '') => String(s).replace(/\D/g, '');
const brl = (n) => `R$ ${Number(n || 0).toFixed(2).replace('.', ',')}`;
const store = {
  get(key, fallback) { try { return localStorage.getItem(`viva-ira:${key}`) ?? fallback; } catch { return fallback; } },
  set(key, value)    { try { localStorage.setItem(`viva-ira:${key}`, value); } catch {} }
};

/* ==========================================================================
   HORÁRIOS E LINKS
   ========================================================================== */
const DIAS = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const fmtHour = (h) => { const m = Math.round((h % 1) * 60); return `${Math.floor(h)}h${m ? String(m).padStart(2, '0') : ''}`; };
const slotOf = (e, day) => e.t24 ? [0, 24] : day === 0 ? e.h.sun : day === 6 ? e.h.sat : e.h.wk;

function status(e, now = new Date()) {
  if (e.t24) return { on: true, text: 'Aberto 24 horas' };
  const day = now.getDay();
  const t = now.getHours() + now.getMinutes() / 60;
  const today = slotOf(e, day);
  if (today && t >= today[0] && t < today[1]) return { on: true, text: `Aberto agora · fecha às ${fmtHour(today[1])}` };
  for (let k = 0; k < 8; k++) {
    const d = (day + k) % 7, s = slotOf(e, d);
    if (!s || (k === 0 && t >= s[0])) continue;
    const when = k === 0 ? 'hoje' : k === 1 ? 'amanhã' : DIAS[d];
    return { on: false, text: `Fechado · abre ${when} às ${fmtHour(s[0])}` };
  }
  return { on: false, text: 'Fechado agora' };
}

const fullAddress = (e) => `${e.end}, ${e.bairro}, ${BRAND.city}-${BRAND.uf}`;
const links = {
  wa:   (e) => `https://wa.me/${digits(e.wa)}?text=${encodeURIComponent(`${BRAND.whatsappMessage}${e.orc ? ' Gostaria de um orçamento.' : ''}`)}`,
  tel:  (e) => `tel:${digits(e.phone)}`,
  maps: (e) => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fullAddress(e))}`,
  waze: (e) => `https://www.waze.com/ul?q=${encodeURIComponent(fullAddress(e))}&navigate=yes`
};

/* ==========================================================================
   ESTADO
   ========================================================================== */
let COMPANIES = [];
let CONTENT = { novidades: [], plantoes: [], configuracoes: {} };
let current = null, galleryIndex = 0, lastFocus = null;

const state = { view: 'inicio', q: '', cat: '', intent: '', sent: false, error: false, favs: new Set() };
try { state.favs = new Set(JSON.parse(store.get('favs', '[]'))); } catch {}
const saveFavs = () => store.set('favs', JSON.stringify([...state.favs]));

const PLAN_RANK = { premium: 0, destaque: 1, presenca: 2, gratis: 3 };
const sortCompanies = (items) => [...items].sort((a, b) => (PLAN_RANK[a.plan] ?? 9) - (PLAN_RANK[b.plan] ?? 9) || a.ordem - b.ordem);

function filtered() {
  const q = norm(state.q.trim());
  return sortCompanies(COMPANIES.filter((e) => {
    if (state.cat && e.catId !== state.cat) return false;
    if (q && !norm([e.name, e.cat, e.sub, e.desc, e.bairro, ...e.tags].join(' ')).includes(q)) return false;
    if (state.intent === 'aberto')     return status(e).on;
    if (state.intent === 'emergencia') return e.emergency;
    if (state.intent === 'delivery')   return e.delivery;
    return true;
  }));
}

/* ==========================================================================
   TEMPLATES · COMPONENTES
   ========================================================================== */
function ratingLabel(e) {
  const count = Number(e.n?.[1] || 0);
  if (!count) return '<span class="rating-label rating-empty">Ainda sem avaliações</span>';
  if (count < 5) return `<span class="rating-label rating-new">Novo no guia · ${count} ${count === 1 ? 'avaliação' : 'avaliações'}</span>`;
  const score = e.n?.[0] ? String(e.n[0]).replace('.', ',') : '—';
  return `<span class="rating-label rating-score"><strong>${esc(score)}</strong> · ${count} avaliações</span>`;
}

const INTENT_ICON = { aberto: 'clock', emergencia: 'siren', delivery: 'truck', perto: 'pin' };
const INTENT_HINT = { aberto: 'Veja quem atende agora', emergencia: 'Atendimento prioritário', delivery: 'Receba onde estiver', perto: 'Encontre opções próximas' };

const intentTiles = () => `<div class="intents">${INTENCOES.map((i) => `
  <button class="intent intent-${i.id}" data-intent="${i.id}" aria-pressed="${state.intent === i.id}">
    <span class="intent-icon">${icon(INTENT_ICON[i.id])}</span>
    <span>${esc(i.label)}<small>${INTENT_HINT[i.id] || ''}</small></span>
  </button>`).join('')}</div>`;

const categoryTiles = () => `<div class="category-grid">${CATEGORIAS.map((c) => `
  <button class="category" data-cat="${c.id}" data-color="${c.color}" aria-pressed="${state.cat === c.id}">
    <span class="cat-icon">${icon(c.icon)}</span><span>${esc(c.nome)}</span>

  const found = COMPANIES.filter((e) => norm([e.name, e.cat, e.sub, ...e.tags].join(' ')).includes(q)).slice(0, 5);
  const body = found.map((e) => `<button data-open="${esc(e.id)}">${icon('search')}<span><strong>${esc(e.name)}</strong><small class="muted">${esc(e.cat)} · ${esc(e.bairro)}</small></span></button>`).join('')

function openCompany(id, photoIndex = 0) {
  const e = COMPANIES.find((x) => x.id === id);
  if (!e) return;
  current = e; galleryIndex = photoIndex; lastFocus = document.activeElement;
  $('#sheet').innerHTML = sheetHTML(e);
  $('#veil').hidden = false;
  document.body.style.overflow = 'hidden';
  $('#sheet-close').focus();
}

function closeCompany() {
  if ($('#veil').hidden) return;
  $('#veil').hidden = true;
  document.body.style.overflow = '';
  current = null;
  lastFocus?.focus?.();
}

function moveGallery(delta) {
  if (!current || current.photos < 2) return;
  galleryIndex = (galleryIndex + delta + current.photos) % current.photos;
  const img = $('#gallery-image');
  img.classList.remove('broken');
  img.src = urlFoto(current.id, galleryIndex, current.ver);
  img.alt = `${current.name}, foto ${galleryIndex + 1}`;
  $('#gallery-count').textContent = `${galleryIndex + 1} / ${current.photos}`;
}

async function shareCompany() {
  if (!current) return;
  const data = { title: current.name, text: `${current.name} no Viva Ira`, url: location.href };
  const label = $('#share-company span');
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(location.href); label.textContent = 'Link copiado'; setTimeout(() => label && (label.textContent = 'Compartilhar'), 1800); }
  } catch { /* usuário cancelou */ }
}

function trapFocus(event) {
  const items = $$('a[href],button:not([disabled])', $('#sheet')).filter((n) => n.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}

/* ==========================================================================
   RENDER, NAVEGAÇÃO E TEMA
   ========================================================================== */
const TABS = [['inicio', 'Início', 'house'], ['buscar', 'Buscar', 'search'], ['favoritos', 'Favoritos', 'heart'], ['perfil', 'Para empresas', 'store']];
const VIEWS = { inicio: homeView, buscar: searchView, favoritos: favoritesView, perfil: profileView };

function render() {
  $('#view').innerHTML = (VIEWS[state.view] || homeView)();
  $('#nav').innerHTML = TABS.map(([id, label, ico]) => `<button data-go="${id}" aria-current="${state.view === id ? 'page' : 'false'}">${icon(ico)}${label}</button>`).join('');
  $('#source-note').textContent = `Fonte: ${window.__source || 'dados locais'} · ${COMPANIES.length} empresas de demonstração`;
}

function navigate(view) {
  state.view = view;
  render();
  scrollTo({ top: 0, behavior: 'smooth' });
}

function applyIntent(id) {
  if (id === 'perto' && state.intent !== 'perto' && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(() => {}, () => {});
  }
  state.intent = state.intent === id ? '' : id;
  state.view = 'buscar';
  render();
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $('#theme-toggle').innerHTML = icon(theme === 'dark' ? 'sun' : 'moon');
  $('#theme-toggle').setAttribute('aria-label', theme === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro');
  $('meta[name=theme-color]').content = theme === 'dark' ? '#091225' : '#102448';
}

function toggleFavorite(id) {
  state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
  saveFavs();
  if (state.view === 'favoritos') return render();
  $$(`[data-fav="${CSS.escape(id)}"]`).forEach((b) => {
    const on = state.favs.has(id);
    b.setAttribute('aria-pressed', on);
    b.setAttribute('aria-label', `${on ? 'Remover dos favoritos:' : 'Salvar nos favoritos:'} ${COMPANIES.find((e) => e.id === id)?.name || ''}`);
  });
}

/* ==========================================================================
   EVENTOS
   ========================================================================== */
document.addEventListener('mouseover', (event) => {
  const btn = event.target.closest('[data-hover-img]');
  if (!btn) return;
  const cardEl = btn.closest('.business-card');
  if (!cardEl) return;
  const coverImg = cardEl.querySelector('.cover img');
  if (coverImg && btn.dataset.hoverImg) {
    coverImg.src = btn.dataset.hoverImg;
    cardEl.querySelectorAll('.thumb-btn').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
  }
});

document.addEventListener('click', (event) => {
  const t = event.target;

  const track = t.closest('[data-track]');
  if (track) registrarContato(track.dataset.id, track.dataset.track, track.dataset.origin || 'public-card');

  if (t.closest('#sheet-close') || t === $('#veil')) return closeCompany();
  if (t.closest('#gallery-prev')) return moveGallery(-1);
  if (t.closest('#gallery-next')) return moveGallery(1);
  if (t.closest('#share-company')) return shareCompany();

  const go = t.closest('[data-go]');
  if (go) { event.preventDefault(); return navigate(go.dataset.go || 'inicio'); }

  const open = t.closest('[data-open]');
  if (open) {
    const photoIdx = Number(open.dataset.photo || 0);
    return openCompany(open.dataset.open, photoIdx);
  }

  const fav = t.closest('[data-fav]');
  if (fav) return toggleFavorite(fav.dataset.fav);

  const cat = t.closest('[data-cat]');
  if (cat) { state.cat = state.cat === cat.dataset.cat ? '' : cat.dataset.cat; state.view = 'buscar'; return render(); }

  const intent = t.closest('[data-intent]');
  if (intent) return applyIntent(intent.dataset.intent);

  if (t.closest('[data-clear]')) { Object.assign(state, { q: '', cat: '', intent: '', view: 'buscar' }); return render(); }
});

document.addEventListener('input', (event) => {
  const id = event.target.id;
  if (id !== 'q' && id !== 'global-q') return;
  state.q = event.target.value;
  if (state.view === 'buscar') paintResults();
  else if (id === 'q') $('#suggestions-slot').innerHTML = suggestions();
});

document.addEventListener('keydown', (event) => {
  const id = event.target.id;
  if ((id === 'q' || id === 'global-q') && event.key === 'Enter') {
    event.preventDefault();
    state.q = event.target.value;
    if (state.view === 'buscar') return paintResults();
    return navigate('buscar');
  }
  if ($('#veil').hidden) return;
  if (event.key === 'Escape') closeCompany();
  else if (event.key === 'ArrowLeft') moveGallery(-1);
  else if (event.key === 'ArrowRight') moveGallery(1);
  else if (event.key === 'Tab') trapFocus(event);
});

document.addEventListener('submit', async (event) => {
  if (event.target.id !== 'reg') return;
  event.preventDefault();
  const nome = $('#r-n').value.trim(), whatsapp = $('#r-w').value.trim(), categoria = $('#r-c').value;
  const msg = $('#form-msg');
  if (!nome || digits(whatsapp).length < 10) {
    msg.innerHTML = '<div class="notice err">Informe o nome da empresa e um WhatsApp com DDD.</div>';
    return;
  }
  const button = event.target.querySelector('button[type=submit]');
  button.disabled = true;
  try { await enviarCadastro({ nome, categoria, whatsapp }); state.sent = true; state.error = false; }
  catch { state.sent = false; state.error = true; }
  render();
});

document.addEventListener('error', (event) => {
  if (event.target.tagName === 'IMG') event.target.classList.add('broken');
}, true);

$('#theme-toggle').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  store.set('theme', next);
  setTheme(next);
});

/* ==========================================================================
   INICIALIZAÇÃO
   ========================================================================== */
document.querySelectorAll('[data-icon]').forEach((n) => n.insertAdjacentHTML('afterbegin', icon(n.dataset.icon)));
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#view').innerHTML = '<div class="loading">Carregando empresas...</div>';

(async () => {
  try {
    const [negocios, conteudo] = await Promise.all([carregarNegocios(), carregarConteudo()]);
    COMPANIES = negocios.lista;
    window.__source = negocios.fonte;
    CONTENT = conteudo;
  } catch (error) {
    console.error(error);
    $('#view').innerHTML = '<div class="loading">Não foi possível carregar o guia agora. Atualize a página em instantes.</div>';
    return;
  }
  render();
})();
</script>
</body>
</html>
