  <div class="header-tools"><span class="city-chip"><svg data-icon="pin"></svg><strong>Iracemápolis, SP</strong></span><button class="icon-btn" id="theme-toggle" type="button" aria-label="Alternar modo de cor"></button></div>

<script type="module">
import { carregarNegocios, carregarConteudo, registrarContato, urlFoto, urlLogo, enviarCadastro } from './ira-data.js';
import { BRAND, CATEGORIAS, INTENCOES, PLANOS } from './config.js';

const ICON={
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>', pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', siren:'<path d="M6 18h12M8 18v-5a4 4 0 0 1 8 0v5M5 10h14M12 3v2M4.7 5.2 6 6.5M19.3 5.2 18 6.5"/>', truck:'<path d="M3 6h10v10H3zM13 10h4l4 3v3h-8"/><circle cx="7" cy="18" r="1.7"/><circle cx="17" cy="18" r="1.7"/>', store:'<path d="M4 10h16v10H4zM3 10l2-6h14l2 6M8 10v3M12 10v3M16 10v3M8 20v-5h8v5"/>', tool:'<path d="m14 6 4 4M5 19l9-9 4 4-9 9H5v-4Z"/><path d="M15 5a4 4 0 0 1 5 5"/>', 'heart-pulse':'<path d="M20 8c0 5-8 11-8 11S4 13 4 8a4 4 0 0 1 7-2 4 4 0 0 1 7 2Z"/><path d="M7 10h2l1.2-2.4L12 14l1.4-3H16"/>', utensils:'<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/>', house:'<path d="m4 11 8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>', sparkle:'<path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z"/><path d="m19 16 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/>', book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22V5.5Z"/><path d="M4 18a2.5 2.5 0 0 1 2.5-2.5H20"/>', paw:'<circle cx="7" cy="8" r="2"/><circle cx="17" cy="8" r="2"/><circle cx="5" cy="14" r="2"/><circle cx="19" cy="14" r="2"/><path d="M12 11c-3 0-5 5-2 7 1.5 1 2.5-1 4 0 3 2 4-2 2-4-1.1-1.4-2-3-4-3Z"/>', party:'<path d="m4 20 8-15 8 15H4Z"/><path d="M12 3v2M5 7l1.5 1M19 7l-1.5 1"/>', heart:'<path d="M20 8c0 5-8 11-8 11S4 13 4 8a4 4 0 0 1 7-2 4 4 0 0 1 7 2Z"/>', phone:'<path d="M6 3h3l2 5-2.2 1.3a12 12 0 0 0 5.9 5.9L16 13l5 2v3a2 2 0 0 1-2 2C10.7 20 4 13.3 4 5a2 2 0 0 1 2-2Z"/>', share:'<circle cx="18" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="m8 11 8-5M8 13l8 5"/>', settings:'<path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="4"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1 6.3 17.7M17.7 6.3l1.4-1.4"/>', moon:'<path d="M20 15.5A8 8 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/>', check:'<path d="m5 12 4 4L19 6"/>', route:'<path d="M5 19h14M7 16l5-5 5 5M12 11V4M9 7l3-3 3 3"/><circle cx="5" cy="19" r="1.5"/><circle cx="19" cy="19" r="1.5"/>', waze:'<path d="M12 3a7 7 0 0 0-7 7c0 4 3 5 3 8h8c0-3 3-4 3-8a7 7 0 0 0-7-7Z"/><path d="M9 14h6M10 18h4M9.5 9.5h.01M14.5 9.5h.01"/>', x:'<path d="m6 6 12 12M18 6 6 18"/>', star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z" fill="currentColor" stroke="none"/>'
};
const icon=(name, cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||ICON.sparkle}</svg>`;
document.querySelectorAll('[data-icon]').forEach((node)=>node.outerHTML=icon(node.dataset.icon));
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=(s='')=>String(s).replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=(s='')=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const brl=(n)=>`R$ ${Number(n||0).toFixed(2).replace('.',',')}`;
const dayNames=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const fmtHour=(h)=>{const m=Math.round((h%1)*60);return `${Math.floor(h)}h${m?String(m).padStart(2,'0'):''}`};
const slot=(e,d)=>e.t24?[0,24]:(d===0?e.h.sun:d===6?e.h.sat:e.h.wk);
function status(e,now=new Date()){
  if(e.t24)return {on:true,text:'Aberto 24 horas'};
  const d=now.getDay(), t=now.getHours()+now.getMinutes()/60, s=slot(e,d);
  if(s&&t>=s[0]&&t<s[1])return {on:true,text:`Aberto agora · fecha às ${fmtHour(s[1])}`};
  for(let k=0;k<8;k++){const dd=(d+k)%7,x=slot(e,dd);if(!x|| (k===0&&t>=x[0]))continue;return {on:false,text:`Fechado · abre ${k===0?'hoje':k===1?'amanhã':dayNames[dd]} às ${fmtHour(x[0])}`};}
  return {on:false,text:'Fechado agora'};
}
const wa=(e)=>`https://wa.me/${String(e.wa).replace(/\D/g,'')}?text=${encodeURIComponent(`${BRAND.whatsappMessage} ${e.orc?'Gostaria de um orçamento.':''}`)}`;
const maps=(e)=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${e.end}, ${e.bairro}, ${BRAND.city}-${BRAND.uf}`)}`;
const waze=(e)=>`https://www.waze.com/ul?q=${encodeURIComponent(`${e.end}, ${e.bairro}, ${BRAND.city}-${BRAND.uf}`)}&navigate=yes`;
let E=[], CONTENT={banners:[],novidades:[],plantoes:[]}, current=null, galleryIndex=0, lastFocus=null;
const state={view:'inicio',q:'',cat:'',intent:'',sub:'',favs:new Set(),banner:0,sent:false,error:false};
try{state.favs=new Set(JSON.parse(localStorage.getItem('viva-ira:favs')||'[]'))}catch{}
const rank={premium:0,destaque:1,presenca:2,gratis:3};
function saveFavs(){try{localStorage.setItem('viva-ira:favs',JSON.stringify([...state.favs]))}catch{}}
function nearbySort(list){return [...list].sort((a,b)=>{if(state.intent==='perto')return (a.location?0:1)-(b.location?0:1);return (rank[a.plan]??9)-(rank[b.plan]??9)||a.ordem-b.ordem})}
function list(){const q=norm(state.q.trim());return nearbySort(E.filter((e)=>{
  const text=norm([e.name,e.cat,e.sub,e.desc,e.bairro,...e.tags].join(' '));
  return (!state.cat||e.catId===state.cat)&&(!state.sub||e.sub===state.sub)&&(!q||text.includes(q))&&(!state.intent||state.intent==='perto'||(state.intent==='aberto'&&status(e).on)||(state.intent==='emergencia'&&e.emergency)||(state.intent==='delivery'&&e.delivery));
}))}
function categoryTiles(){return `<div class="category-grid">${CATEGORIAS.map((c)=>`<button class="category" data-cat="${c.id}" data-color="${c.color}" aria-pressed="${state.cat===c.id}"><span class="cat-icon">${icon(c.icon)}</span><span>${esc(c.nome)}</span></button>`).join('')}</div>`}
function intentIcon(id){return ({aberto:'clock',emergencia:'siren',delivery:'truck',perto:'pin'}[id]||'sparkle')}
function intentTiles(){return `<div class="intents">${INTENCOES.map((item)=>`<button class="intent intent-${item.id}" data-intent="${item.id}" aria-pressed="${state.intent===item.id}"><span class="intent-icon">${icon(intentIcon(item.id))}</span><span>${item.label}<small>${item.id==='aberto'?'Veja quem atende agora':item.id==='emergencia'?'Atendimento prioritário':item.id==='delivery'?'Receba onde estiver':'Encontre opções próximas'}</small></span></button>`).join('')}</div>`}
function card(e){const s=status(e);const favorite=state.favs.has(e.id);return `<article class="business-card">
  <button class="cover" data-open="${esc(e.id)}" aria-label="Abrir perfil de ${esc(e.name)}"><img loading="lazy" alt="${esc(e.name)}" src="${urlFoto(e.id,0,e.ver)}" onerror="this.style.opacity='.15'"><span class="badge ${e.plan==='premium'?'premium':''}">${e.plan==='premium'?'Premium':e.plan==='destaque'?'Destaque':e.cat}</span>${e.verified?`<span class="badge verified">${icon('check')} Verificado</span>`:''}</button>
  <button class="save" data-fav="${esc(e.id)}" aria-pressed="${favorite}" aria-label="${favorite?'Remover':'Salvar'} ${esc(e.name)}">${icon('heart')}</button>
  <div class="card-body"><div class="card-title"><h3>${esc(e.name)}</h3></div><div class="card-meta"><span class="star">★</span><strong>${e.n[0]?String(e.n[0]).replace('.',','):'—'}</strong><span>(${e.n[1]||0})</span><span>·</span><span>${esc(e.cat)}</span></div><div class="open-status ${s.on?'':'closed'}"><span class="dot"></span>${esc(s.on?'Aberto agora':s.text.replace('Fechado · ','Fechado · '))}</div><p class="card-desc">${esc(e.desc||'Perfil em atualização.')}</p><div class="card-location">${icon('pin')}<span>${esc(e.bairro||'Iracemápolis')}</span></div><div class="card-actions"><a class="action-wa" data-track="whatsapp" data-id="${esc(e.id)}" href="${wa(e)}" target="_blank" rel="noopener">${icon('phone')} WhatsApp</a><a class="action-call" data-track="ligar" data-id="${esc(e.id)}" href="tel:${String(e.phone).replace(/\D/g,'')}">${icon('phone')} Ligar</a></div></div></article>`}
function suggestions(){const q=norm(state.q.trim());if(!q)return '';const found=[];for(const e of E){if(norm([e.name,e.cat,e.sub,...e.tags].join(' ')).includes(q))found.push(e)}return `<div class="suggestions" role="listbox">${found.slice(0,5).map((e)=>`<button data-open="${esc(e.id)}">${icon('search')}<span><strong>${esc(e.name)}</strong><small class="muted">${esc(e.cat)} · ${esc(e.bairro)}</small></span></button>`).join('')||`<button data-go="buscar">${icon('search')}Ver resultados para “${esc(state.q)}”</button>`}</div>`}
function globalSearch(){return `<div class="global-search"><span class="global-search-icon">${icon('search')}</span><label class="sr" for="global-q">Buscar novamente</label><input id="global-q" type="search" autocomplete="off" placeholder="Buscar empresa, serviço ou categoria..." value="${esc(state.q)}"><button class="global-search-go" data-go="buscar" type="button">Buscar</button></div>`}

function hero(){return `<section class="hero"><div><span class="eyebrow">Guia local · ${BRAND.city}</span><h1>O que você precisa <em>resolver</em> hoje?</h1><p class="lead">Encontre quem atende perto de você, compare opções e fale direto com a empresa.</p><div class="hero-search"><label class="sr" for="q">Buscar empresas, serviços ou produtos</label>${icon('search')}<input id="q" type="search" autocomplete="off" placeholder="Ex.: encanador, marmita, dentista..." value="${esc(state.q)}"><button class="search-send" data-go="buscar" type="button">Encontrar</button>${suggestions()}</div></div><div class="hero-art"><svg viewBox="0 0 500 360" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="M-10 300C60 245 75 145 160 142s85 83 166 45 91-123 184-117v300H-10Z" fill="rgba(255,255,255,.09)"/><path d="M285 360V190h85v170M265 190l62-72 63 72M309 360v-70h38v70" fill="none" stroke="rgba(255,255,255,.88)" stroke-width="7" stroke-linejoin="round"/><circle cx="328" cy="218" r="17" fill="var(--coral)"/><path d="M328 205v13l8 4" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M84 360V244h78v116M64 244l59-62 59 62M111 360v-52h24v52" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="6"/><circle cx="123" cy="268" r="13" fill="var(--amber)"/></svg><div class="hero-note"><strong>Mais perto.</strong><span>Mais confiança para o seu dia.</span></div></div></section>`}
function banners(){const items=(CONTENT.banners||[]).filter((b)=>b.ativo!==false).sort((a,b)=>(a.ordem||0)-(b.ordem||0));if(!items.length)return '';state.banner=Math.min(state.banner,Math.max(0,items.length-1));return `<section class="banner-slider" aria-label="Destaques"><div class="slides">${items.map((b,i)=>`<article class="banner-slide ${i===state.banner?'active':''}" data-color="${esc(b.cor||'navy')}"><span class="eyebrow">${esc(b.eyebrow||'VIVA A CIDADE')}</span><h2>${esc(b.titulo)}</h2><p>${esc(b.texto||'')}</p>${b.link?`<a href="${esc(b.link)}" data-go="${b.link.replace('#','')}">${esc(b.cta||'Saiba mais')} →</a>`:''}</article>`).join('')}</div><div class="banner-dots">${items.map((_,i)=>`<button aria-label="Banner ${i+1}" class="${i===state.banner?'active':''}" data-banner="${i}"></button>`).join('')}</div></section>`}
function sectionHead(title,sub,go='buscar'){return `<div class="section-head"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="section-link" data-go="${go}">Ver todos →</button></div>`}
function nearbyPanel(){const items=nearbySort(E).slice(0,4);return `<div class="panel"><div class="panel-head"><div><h3>Perto de você</h3><p>Opções que merecem sua atenção hoje.</p></div>${icon('pin')}</div><div class="nearby-list">${items.map((e,i)=>`<button class="nearby-row" data-open="${e.id}"><img class="mini-cover" src="${urlFoto(e.id,0,e.ver)}" alt=""><span><strong>${esc(e.name)}</strong><small>${esc(e.cat)} · ${esc(e.bairro)}</small></span><span class="rank">${i+1}</span></button>`).join('')}</div></div>`}
function emergencyPanel(){const items=E.filter((e)=>e.emergency);return `<div class="panel emergency"><div class="panel-head"><div><h3>Plantão & emergência</h3><p>Quando não dá para esperar, comece por aqui.</p></div>${icon('siren')}</div>${(CONTENT.plantoes||[]).filter((p)=>p.ativo!==false).map((p)=>`<button class="plantao-card" data-intent="${p.categoria==='Saúde'?'emergencia':'emergencia'}"><span class="plantao-icon">${icon(p.icon||'siren')}</span><span><strong>${esc(p.titulo)}</strong><small>${esc(p.texto)}</small></span><span class="arrow-link">→</span></button>`).join('')}${items.length?`<div style="margin-top:12px;padding-top:11px;border-top:1px solid rgba(255,255,255,.14);font-size:12px;color:#f4d9d0">${items.length} empresa(s) marcada(s) para atendimento especial.</div>`:''}</div>`}
function news(){const items=(CONTENT.novidades||[]).filter((n)=>n.ativo!==false).slice(0,3);return `<div class="news-grid">${items.map((n)=>`<article class="news-card"><span class="eyebrow">${esc(n.tag||'NOVIDADE')}</span><h3>${esc(n.titulo)}</h3><p>${esc(n.texto)}</p></article>`).join('')}</div>`}
function home(){const featured=E.filter((e)=>e.plan==='premium'||e.plan==='destaque').slice(0,4);return `${hero()}<section class="section">${sectionHead('Escolha pelo que você precisa','Atalhos rápidos para resolver o dia.','buscar')}${intentTiles()}</section><section class="section"><div class="section-head"><div><h2>Explore por <em>categoria</em></h2><p>Do essencial ao especial, tudo organizado.</p></div></div>${categoryTiles()}</section>${banners()}<section class="section">${sectionHead('Destaques em Iracemápolis','Empresas que estão fazendo bonito por aqui.','buscar')}<div class="grid">${featured.length?featured.map(card).join(''):list().slice(0,4).map(card).join('')}</div></section><section class="section split">${nearbyPanel()}${emergencyPanel()}</section><section class="section">${sectionHead('Novidades na cidade','Conteúdo rápido para descobrir algo novo.','perfil')}${news()}</section><div class="cta-business"><div><h2>Sua empresa merece ser encontrada.</h2><p>Crie um perfil e apareça para quem está procurando agora.</p></div><a href="#perfil" data-go="perfil">Cadastrar empresa →</a></div>`}
function filters(){return `<div class="filters">${INTENCOES.map((x)=>`<button class="filter-chip filter-${x.id}" data-intent="${x.id}" aria-pressed="${state.intent===x.id}">${icon(intentIcon(x.id))}<span>${x.label}</span></button>`).join('')}<button class="filter-chip filter-clear" data-clear="true">${icon('x')}<span>Limpar filtros</span></button></div>`}
function searchView(){const results=list();return `${globalSearch()}<section class="section" style="padding-top:26px"><span class="eyebrow">Descoberta local</span><div class="section-head"><div><h2>${state.q?`Resultados para <em>“${esc(state.q)}”</em>`:'Todas as empresas'}</h2><p>Escolha uma opção e vá direto ao ponto.</p></div><span class="result-count">${results.length} resultado(s)</span></div>${categoryTiles()}${filters()}<div class="grid">${results.length?results.map(card).join(''):`<div class="empty">${icon('search')}<br><strong>Nada encontrado ainda.</strong><br>Tente outra palavra ou retire um filtro.</div>`}</div></section>`}
function favView(){const results=E.filter((e)=>state.favs.has(e.id));return `${globalSearch()}<section class="section" style="padding-top:26px">${sectionHead('Seus <em>favoritos</em>','Lugares guardados para você voltar depois.','buscar')}<div class="grid">${results.length?results.map(card).join(''):`<div class="empty">${icon('heart')}<br><strong>Sua lista ainda está vazia.</strong><br>Toque no coração de um card para salvar uma empresa.</div>`}</div></section>`}
function profileView(){return `${globalSearch()}<section class="section" style="padding-top:26px"><span class="eyebrow">Para empresas locais</span><div class="section-head"><div><h2>Faça sua empresa <em>ser encontrada</em></h2><p>Envie seus dados. Nossa equipe confirma o WhatsApp antes de publicar.</p></div></div><div class="profile-layout"><form class="form-card" id="reg">${state.error?'<div style="background:color-mix(in srgb,var(--coral) 12%,transparent);padding:11px;border-radius:12px;margin-bottom:14px;color:var(--coral)">Não foi possível enviar agora. Tente novamente em instantes.</div>':''}${state.sent?'<div style="background:color-mix(in srgb,var(--green) 12%,transparent);padding:11px;border-radius:12px;margin-bottom:14px;color:var(--green)">Cadastro recebido. Vamos confirmar o WhatsApp e publicar seu perfil em até 1 dia útil.</div>':''}<label>Nome da empresa<input id="r-n" required placeholder="Ex.: Padaria Pão de Praça"></label><label>Categoria<select id="r-c">${CATEGORIAS.map((c)=>`<option>${c.nome}</option>`).join('')}</select></label><label>WhatsApp<input id="r-w" required inputmode="tel" placeholder="(19) 9 0000-0000"></label><button type="submit">Enviar cadastro →</button></form><div class="plans-mini">${Object.entries(PLANOS).map(([id,p])=>`<article class="plan-mini"><h3>${p.label}</h3><strong>${p.price?'a partir de '+brl(p.price)+'/mês':'Gratuito'}</strong><p>${p.description}</p></article>`).join('')}</div></div></section>`}
const TABS=[['inicio','Início','house'],['buscar','Buscar','search'],['favoritos','Favoritos','heart'],['perfil','Para empresas','store']];
function render(){const fn={inicio:home,buscar:searchView,favoritos:favView,perfil:profileView}[state.view]||home;$('#view').innerHTML=fn();$('#nav').innerHTML=TABS.map(([id,label,ico])=>`<button data-go="${id}" aria-current="${state.view===id?'page':'false'}">${icon(ico)}${label}</button>`).join('');if($('#source-note'))$('#source-note').textContent=`Fonte: ${window.__source||'dados locais'} · ${E.length} empresas de demonstração`}
function openCompany(id){const e=E.find((x)=>x.id===id);if(!e)return;current=e;galleryIndex=0;lastFocus=document.activeElement;const s=status(e);const services=e.services?.length?`<div class="detail-block"><h3>Serviços e produtos</h3><div class="service-list">${e.services.map((x)=>`<div class="service"><span>${esc(x.nome||x)}</span>${x.preco?`<small>${esc(x.preco)}</small>`:''}</div>`).join('')}</div></div>`:'';const rows=e.t24?'<span>Todos os dias</span><span>24 horas</span>':[['Segunda a sexta',e.h.wk],['Sábado',e.h.sat],['Domingo',e.h.sun]].map(([l,h])=>`<span>${l}</span><span>${h?`${fmtHour(h[0])} às ${fmtHour(h[1])}`:'Fechado'}`).join('');$('#sheet').innerHTML=`<button class="sheet-close" id="sheet-close" aria-label="Fechar">×</button><div class="sheet-main"><div class="sheet-gallery"><img id="gallery-image" src="${urlFoto(e.id,0,e.ver)}" alt="${esc(e.name)}, foto 1" onerror="this.style.opacity='.15'"><div class="gallery-nav">${e.photos>1?`<button id="gallery-prev" aria-label="Foto anterior">‹</button><button id="gallery-next" aria-label="Próxima foto">›</button>`:''}</div><span class="gallery-count" id="gallery-count">1 / ${e.photos}</span></div><div class="sheet-info"><div class="eyebrow">${esc(e.cat)} · ${esc(e.sub)}</div><h2 id="sheet-title">${esc(e.name)}</h2><div class="category-line">${icon('star')} <strong>${e.n[0]?String(e.n[0]).replace('.',','):'—'}</strong> (${e.n[1]||0} avaliações) · ${esc(e.bairro)}</div><div class="detail-status"><span class="detail-pill ${s.on?'live':''}"><span class="dot"></span>${esc(s.text)}</span>${e.verified?`<span class="detail-pill verify">${icon('check')} Verificado</span>`:''}${e.delivery?`<span class="detail-pill">${icon('truck')} ${e.f===0?'Entrega grátis':'Delivery'}</span>`:''}${e.ret?'<span class="detail-pill">Retirada no local</span>':''}</div><p>${esc(e.desc||'Perfil em atualização.')}</p>${services}<div class="detail-block"><h3>Onde encontrar</h3><div class="detail-row"><b>Endereço</b><span>${esc(e.end)}<br>${esc(e.bairro)}, ${BRAND.city}-${BRAND.uf}</span></div><div class="socials"><a target="_blank" rel="noopener" href="${maps(e)}">${icon('route')} <span>Como chegar</span></a><a class="social-route waze-link" target="_blank" rel="noopener" href="${waze(e)}">${icon('waze')} <span>Waze</span></a>${e.social?.instagram?`<a target="_blank" rel="noopener" href="${esc(e.social.instagram)}">Instagram</a>`:''}</div></div><div class="detail-block"><h3>Horários</h3><div class="hours">${rows}</div></div></div></div><div class="sheet-actions"><a class="wa" data-track="whatsapp" data-id="${esc(e.id)}" href="${wa(e)}" target="_blank" rel="noopener">${icon('phone')}<span>${e.orc?'Pedir orçamento':'WhatsApp'}</span></a><a data-track="ligar" data-id="${esc(e.id)}" href="tel:${String(e.phone).replace(/\D/g,'')}">${icon('phone')}<span>Ligar</span></a><button id="share-company">${icon('share')}<span>Compartilhar</span></button></div>`;$('#veil').hidden=false;document.body.style.overflow='hidden';$('#sheet-close').focus()}
function closeCompany(){if($('#veil').hidden)return;$('#veil').hidden=true;document.body.style.overflow='';current=null;lastFocus?.focus?.()}
function slide(delta){if(!current||current.photos<2)return;galleryIndex=(galleryIndex+delta+current.photos)%current.photos;$('#gallery-image').src=urlFoto(current.id,galleryIndex,current.ver);$('#gallery-image').alt=`${current.name}, foto ${galleryIndex+1}`;$('#gallery-count').textContent=`${galleryIndex+1} / ${current.photos}`}
function requestNear(){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(()=>{state.intent='perto';state.view='buscar';render()},()=>{state.intent='perto';state.view='buscar';render()});else{state.intent='perto';state.view='buscar';render()}}
function theme(){const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('viva-ira:theme',dark?'light':'dark');$('#theme-toggle').innerHTML=icon(dark?'moon':'sun');$('#theme-toggle').setAttribute('aria-label',dark?'Ativar modo escuro':'Ativar modo claro')}
const savedTheme=localStorage.getItem('viva-ira:theme')||'light';document.documentElement.dataset.theme=savedTheme;$('#theme-toggle').innerHTML=icon(savedTheme==='dark'?'moon':'sun');
$('#theme-toggle').addEventListener('click',theme);
document.addEventListener('input',(event)=>{if(event.target.id==='q'||event.target.id==='global-q'){state.q=event.target.value;if(event.target.id==='global-q'&&state.view!=='buscar'){const field=event.target;field.closest('.global-search')?.classList.toggle('has-value',!!state.q)}if(state.view==='buscar'&&event.target.id==='q')render();else if(event.target.id==='q'){const box=document.querySelector('.hero-search');const old=box?.querySelector('.suggestions');if(old)old.remove();if(box&&state.q)box.insertAdjacentHTML('beforeend',suggestions())}}});
document.addEventListener('click',(event)=>{const t=event.target;const go=t.closest('[data-go]');if(go){event.preventDefault();const next=go.dataset.go||'inicio';state.view=next;render();if(next==='buscar')setTimeout(()=>$('#q')?.focus(),0);scrollTo({top:0,behavior:'smooth'});return}const open=t.closest('[data-open]');if(open){openCompany(open.dataset.open);return}const fav=t.closest('[data-fav]');if(fav){const id=fav.dataset.fav;state.favs.has(id)?state.favs.delete(id):state.favs.add(id);saveFavs();render();return}const cat=t.closest('[data-cat]');if(cat){state.cat=state.cat===cat.dataset.cat?'':cat.dataset.cat;state.sub='';state.view='buscar';render();return}const intent=t.closest('[data-intent]');if(intent){if(intent.dataset.intent==='perto')requestNear();else{state.intent=state.intent===intent.dataset.intent?'':intent.dataset.intent;state.view='buscar';render()}return}if(t.closest('[data-clear]')){state.q='';state.cat='';state.intent='';state.sub='';state.view='buscar';render();return}const banner=t.closest('[data-banner]');if(banner){state.banner=Number(banner.dataset.banner);render();return}const track=t.closest('[data-track]');if(track)registrarContato(track.dataset.id,track.dataset.track,'public-card');if(t.closest('#veil')&&t=== $('#veil'))closeCompany();if(t.closest('#sheet-close'))closeCompany();if(t.closest('#gallery-prev'))slide(-1);if(t.closest('#gallery-next'))slide(1);if(t.closest('#share-company')&&current){const share={title:current.name,text:`${current.name} no Viva Ira`,url:location.href};navigator.share?navigator.share(share).catch(()=>{}):navigator.clipboard?.writeText(location.href)} });
document.addEventListener('keydown',(event)=>{if((event.target.id==='global-q'||event.target.id==='q')&&event.key==='Enter'){event.preventDefault();state.q=event.target.value;state.view='buscar';render();return}if($('#veil').hidden)return;if(event.key==='Escape')closeCompany();if(event.key==='ArrowLeft')slide(-1);if(event.key==='ArrowRight')slide(1)});
document.addEventListener('submit',async(event)=>{if(event.target.id!=='reg')return;event.preventDefault();const button=event.target.querySelector('button');button.disabled=true;try{await enviarCadastro({nome:$('#r-n').value,categoria:$('#r-c').value,whatsapp:$('#r-w').value});state.sent=true;state.error=false}catch{state.error=true}render()});
(async()=>{const [{lista,fonte},content]=await Promise.all([carregarNegocios(),carregarConteudo()]);E=lista;window.__source=fonte;CONTENT=content;render();setInterval(()=>{const total=(CONTENT.banners||[]).filter((b)=>b.ativo!==false).length;if(total>1){state.banner=(state.banner+1)%total;if(state.view==='inicio')render()}},7000)})();
</script>
</body>
</html>
